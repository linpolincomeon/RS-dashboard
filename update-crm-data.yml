name: Update CRM Dashboard Data

on:
  schedule:
    - cron: '0 11,15,19,23 * * *'   # anchor: 8am, 12pm, 4pm, 8pm Chile (UTC-3)
    - cron: '0 13,17,21 * * 5'      # VIERNES extra: con el diario queda cada ~2h (11,13,15,17,19,21,23 UTC)
    - cron: '0 14 * * 5'            # VIERNES: 14:00 UTC = 10am GMT-4, dato fresco 1h antes de la reunion (11am GMT-4 = 15:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch CRM data from Odoo
        env:
          ODOO_URL: https://tomenergy.cl
          ODOO_DB: PRODUCCION
          ODOO_USER: p@tomenergy.cl
          ODOO_KEY: ${{ secrets.ODOO_KEY }}
        run: python extract_crm.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crm-data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update CRM data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
