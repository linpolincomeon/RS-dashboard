<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TomEnergy — Reporte Bodega</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');

  :root {
    /* Paleta corporativa TomEnergy */
    --background: #f7f6f3;
    --card:       #ffffff;
    --texto:      #1a1a1a;
    --texto-suave:#666666;
    --borde:      #e6e4df;

    --naranja:    #E8451A;   /* Brand orange */
    --naranja-dk: #c8360e;   /* Acento rojo (más oscuro) */
    --verde:      #C8D9A0;   /* Brand green */
    --verde-dk:   #6F8B3A;   /* Verde más oscuro para texto/iconos */
    --amarillo:   #F5C842;   /* Brand yellow */
    --amarillo-dk:#B8902A;

    /* Colores funcionales (para tipos de movimiento) */
    --violeta:    #8B5CF6;
    --azul:       #2E6FD4;
    --rojo:       #c8360e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--background);
    color: var(--texto);
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
    padding-bottom: 50px;
    font-weight: 400;
  }

  /* HEADER */
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--borde);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    height: 36px;
    width: auto;
    flex-shrink: 0;
  }
  .header-text h1 {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.2px;
    line-height: 1.1;
    color: var(--texto);
  }
  .header-text p {
    font-size: 12px;
    color: var(--texto-suave);
    margin-top: 2px;
    font-weight: 500;
  }

  /* FORM */
  .container { padding: 20px 16px; max-width: 480px; margin: 0 auto; }

  .section-label {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--naranja-dk);
    text-transform: uppercase;
    margin-bottom: 8px;
    margin-top: 24px;
  }

  /* CAMION SELECTOR */
  .camion-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .camion-btn {
    background: var(--card);
    border: 2px solid var(--borde);
    color: var(--texto);
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 22px;
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 8px;
    line-height: 1.2;
    letter-spacing: 1px;
  }
  .camion-btn .placa {
    display: block;
    font-weight: 800;
  }
  .camion-btn.active {
    border-color: var(--naranja);
    background: #FFF5F0;
    color: var(--naranja-dk);
  }
  .camion-btn.active .placa { color: var(--naranja-dk); }
  .camion-btn:active { transform: scale(0.97); }
  .camion-btn-small {
    padding: 10px 8px;
    font-size: 16px;
  }

  /* TIPO MOVIMIENTO */
  .tipo-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tipo-btn {
    background: var(--card);
    border: 2px solid var(--borde);
    color: var(--texto);
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.15s;
  }
  .tipo-btn .icono { font-size: 20px; flex-shrink: 0; }
  .tipo-btn .tipo-desc {
    font-size: 12px;
    font-weight: 500;
    color: var(--texto-suave);
    display: block;
    margin-top: 2px;
  }
  .tipo-btn:active { transform: scale(0.98); }

  .tipo-btn[data-tipo="inicio"].active         { border-color: var(--violeta); background: #F3EFFB; }
  .tipo-btn[data-tipo="carga"].active          { border-color: var(--azul);    background: #EAF1FB; }
  .tipo-btn[data-tipo="venta"].active          { border-color: var(--naranja); background: #FFF0EA; }
  .tipo-btn[data-tipo="traslado_sale"].active  { border-color: var(--amarillo-dk); background: #FDF5E0; }
  .tipo-btn[data-tipo="traslado_entra"].active { border-color: var(--verde-dk); background: #F0F5E5; }
  .tipo-btn[data-tipo="cierre"].active         { border-color: var(--verde-dk); background: #F0F5E5; }

  /* TRASLADO FIELDS (selector de otro camión) */
  .traslado-fields {
    display: none;
    margin-top: 16px;
    padding: 14px;
    background: #FDF5E0;
    border: 1px dashed var(--amarillo-dk);
    border-radius: 8px;
  }
  .traslado-fields.visible { display: block; }
  .traslado-titulo {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: var(--amarillo-dk);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* INPUTS */
  .input-group { margin-top: 8px; }
  input[type="number"], input[type="text"], input[type="tel"] {
    width: 100%;
    background: var(--card);
    border: 2px solid var(--borde);
    color: var(--texto);
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 26px;
    padding: 14px 16px;
    border-radius: 8px;
    outline: none;
    appearance: none;
    -moz-appearance: textfield;
  }
  input[type="number"]:focus, input[type="text"]:focus, input[type="tel"]:focus {
    border-color: var(--naranja);
    background: #FFF5F0;
  }
  input::placeholder { color: #B5B0A8; font-weight: 500; font-size: 18px; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  input.input-small {
    font-size: 18px;
    padding: 12px 16px;
  }

  /* CAMPOS EXTRA */
  .extra-fields {
    display: none;
    flex-direction: column;
    gap: 16px;
    margin-top: 0;
  }
  .extra-fields.visible { display: flex; }

  .divider { height: 1px; background: var(--borde); margin: 24px 0 0; }

  /* SUBMIT */
  .submit-btn {
    width: 100%;
    background: var(--naranja);
    color: #ffffff;
    font-family: 'DM Sans', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.5px;
    padding: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 24px;
    transition: all 0.15s;
    text-transform: uppercase;
    box-shadow: 0 2px 8px rgba(232, 69, 26, 0.25);
  }
  .submit-btn:active { transform: scale(0.98); background: var(--naranja-dk); }
  .submit-btn:disabled {
    background: var(--borde);
    color: #999;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* PREVIEW */
  .preview-box {
    background: var(--card);
    border: 1px solid var(--borde);
    border-left: 4px solid var(--naranja);
    border-radius: 8px;
    padding: 14px 16px;
    margin-top: 16px;
    display: none;
  }
  .preview-box.visible { display: block; }
  .preview-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--texto-suave);
    text-transform: uppercase;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .preview-content {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--texto);
    line-height: 1.6;
  }
  .preview-content span { color: var(--naranja-dk); font-weight: 700; }

  /* SUCCESS */
  .success-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .success-screen.visible { display: block; }
  .success-icon { font-size: 64px; margin-bottom: 16px; }
  .success-screen h2 {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--verde-dk);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .success-screen p { color: var(--texto-suave); margin-bottom: 24px; font-weight: 500; }
  .success-detail {
    background: var(--card);
    border: 1px solid var(--borde);
    border-left: 4px solid var(--verde-dk);
    padding: 14px 16px;
    text-align: left;
    border-radius: 0 8px 8px 0;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--texto);
    margin-bottom: 24px;
    line-height: 1.8;
  }
  .nuevo-btn {
    background: var(--card);
    border: 2px solid var(--naranja);
    color: var(--naranja-dk);
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 32px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .nuevo-btn:active { background: #FFF5F0; }

  /* TIMESTAMP */
  .timestamp-bar {
    background: var(--card);
    border-top: 1px solid var(--borde);
    padding: 8px 20px;
    font-size: 11px;
    color: var(--texto-suave);
    text-align: center;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    letter-spacing: 1px;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
  }
</style>
</head>
<body>

<div class="header">
  <img src="tomenergy_logo.png" alt="TomEnergy" class="header-logo">
  <div class="header-text">
    <h1>REPORTE BODEGA</h1>
    <p id="fecha-header">Cargando fecha...</p>
  </div>
</div>

<div class="container" id="main-form">

  <!-- CAMIÓN o BODEGA -->
  <div class="section-label">1. Tu camión o bodega</div>
  <div class="camion-grid">
    <button class="camion-btn" data-camion="PY" onclick="selCamion(this)">
      <span class="placa">PY</span>
    </button>
    <button class="camion-btn" data-camion="SH" onclick="selCamion(this)">
      <span class="placa">SH</span>
    </button>
    <button class="camion-btn" data-camion="VD" onclick="selCamion(this)">
      <span class="placa">VD</span>
    </button>
    <button class="camion-btn" data-camion="PH" onclick="selCamion(this)">
      <span class="placa">PH</span>
    </button>
    <button class="camion-btn" data-camion="TJ" onclick="selCamion(this)">
      <span class="placa">TJ</span>
    </button>
    <button class="camion-btn" data-camion="HH" onclick="selCamion(this)">
      <span class="placa">HH</span>
    </button>
    <button class="camion-btn" data-camion="TY" onclick="selCamion(this)">
      <span class="placa">TY</span>
    </button>
    <button class="camion-btn" data-camion="OTRA" onclick="selCamion(this)" style="background: #FEF3E7; border-color: var(--naranja);">
      <span class="placa" style="color: var(--naranja-dk);">OTRA</span>
    </button>
  </div>

  <!-- TIPO -->
  <div class="section-label">2. Tipo de movimiento</div>
  <div class="tipo-grid">
    <button class="tipo-btn" data-tipo="inicio" onclick="selTipo(this)">
      <span class="icono">🟣</span>
      <div>INICIO DEL DÍA
        <span class="tipo-desc">Saldo con que arrancas la jornada</span>
      </div>
    </button>
    <button class="tipo-btn" data-tipo="carga" onclick="selTipo(this)">
      <span class="icono">🔵</span>
      <div>CARGA ENAP
        <span class="tipo-desc">Litros cargados en planta (saldo previo = 0)</span>
      </div>
    </button>
    <button class="tipo-btn" data-tipo="venta" onclick="selTipo(this)">
      <span class="icono">🟠</span>
      <div>VENTA
        <span class="tipo-desc">Despacho a cliente con factura</span>
      </div>
    </button>
    <button class="tipo-btn" data-tipo="traslado_sale" onclick="selTipo(this)">
      <span class="icono">🟡</span>
      <div>TRASLADO −
        <span class="tipo-desc">ENTREGO litros a otro camión (resta)</span>
      </div>
    </button>
    <button class="tipo-btn" data-tipo="traslado_entra" onclick="selTipo(this)">
      <span class="icono">🟢</span>
      <div>TRASLADO +
        <span class="tipo-desc">RECIBO litros de otro camión (suma)</span>
      </div>
    </button>
    <button class="tipo-btn" data-tipo="cierre" onclick="selTipo(this)">
      <span class="icono">🟢</span>
      <div>CIERRE DEL DÍA
        <span class="tipo-desc">Saldo final al terminar la jornada</span>
      </div>
    </button>
  </div>

  <!-- OTRO CAMIÓN o DESTINO (solo se muestra en traslados) -->
  <div class="traslado-fields" id="traslado-fields">
    <div class="traslado-titulo" id="traslado-titulo">¿A qué destino?</div>
    <div class="camion-grid">
      <button class="camion-btn camion-btn-small" data-otro="PY" onclick="selOtroCamion(this)"><span class="placa">PY</span></button>
      <button class="camion-btn camion-btn-small" data-otro="SH" onclick="selOtroCamion(this)"><span class="placa">SH</span></button>
      <button class="camion-btn camion-btn-small" data-otro="VD" onclick="selOtroCamion(this)"><span class="placa">VD</span></button>
      <button class="camion-btn camion-btn-small" data-otro="PH" onclick="selOtroCamion(this)"><span class="placa">PH</span></button>
      <button class="camion-btn camion-btn-small" data-otro="TJ" onclick="selOtroCamion(this)"><span class="placa">TJ</span></button>
      <button class="camion-btn camion-btn-small" data-otro="HH" onclick="selOtroCamion(this)"><span class="placa">HH</span></button>
      <button class="camion-btn camion-btn-small" data-otro="TY" onclick="selOtroCamion(this)"><span class="placa">TY</span></button>
      <button class="camion-btn camion-btn-small" data-otro="OTRA" onclick="selOtroCamion(this)" style="grid-column: span 2; background: #FEF3E7; border-color: var(--naranja);"><span class="placa" style="color: var(--naranja-dk);">OTRA (estanque)</span></button>
    </div>
  </div>

  <!-- LITROS -->
  <div class="section-label">3. Litros</div>
  <div class="input-group">
    <input type="tel" id="litros" placeholder="0" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           oninput="limpiarLitros(this); actualizarPreview()">
  </div>

  <!-- CAMPOS EXTRA (solo ventas) -->
  <div class="extra-fields" id="extra-fields">
    <div>
      <div class="section-label">4. N° Factura</div>
      <div class="input-group">
        <input type="text" id="factura" class="input-small" placeholder="52xxx"
               inputmode="numeric" oninput="actualizarPreview()">
      </div>
    </div>
    <div>
      <div class="section-label">5. Cliente (opcional)</div>
      <div class="input-group">
        <input type="text" id="cliente" class="input-small" placeholder="Nombre cliente (opcional)"
               oninput="actualizarPreview()">
      </div>
    </div>
  </div>

  <!-- OBSERVACIÓN -->
  <div class="section-label" id="obs-label">4. Observación (opcional)</div>
  <div class="input-group">
    <input type="text" id="observacion" class="input-small" placeholder="Ej: rotura manguera..."
           oninput="actualizarPreview()">
  </div>

  <!-- PREVIEW -->
  <div class="preview-box" id="preview-box">
    <div class="preview-label">Vista previa del reporte</div>
    <div class="preview-content" id="preview-content"></div>
  </div>

  <div class="divider"></div>
  <button class="submit-btn" id="submit-btn" onclick="enviar()" disabled>ENVIAR REPORTE</button>

</div>

<!-- SUCCESS SCREEN -->
<div class="container success-screen" id="success-screen">
  <div class="success-icon">✅</div>
  <h2>REGISTRADO</h2>
  <p>Tu reporte fue guardado correctamente.</p>
  <div class="success-detail" id="success-detail"></div>
  <button class="nuevo-btn" onclick="nuevoReporte()">+ NUEVO MOVIMIENTO</button>
</div>

<div class="timestamp-bar" id="timestamp-bar">⏱ —</div>

<!-- ENVÍO SIN CORS: form nativo apuntando a un iframe oculto.
     El navegador no espera respuesta del servidor, así que Google no bloquea nada. -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
<form id="envio-form"
      action="https://script.google.com/macros/s/AKfycbyHbnqCOn01GIanDjEXxULDreMAEr6B0WaDizlgqoO1KaISiydyM6Fr7C_MsVli4zGW/exec"
      method="POST"
      target="hidden_iframe"
      style="display:none;">
  <input type="hidden" name="payload" id="payload-input">
</form>

<script>
  let camionSel = null;
  let tipoSel = null;
  let otroCamionSel = null;
  // La URL del webhook vive en el atributo action del <form id="envio-form">.

  function pad(n){ return n.toString().padStart(2,'0'); }

  function limpiarLitros(input){
    input.value = input.value.replace(/\D/g, '');
  }

  function formatearMiles(n){
    return Number(n).toLocaleString('es-CL').replace(/,/g, '.');
  }

  function updateTime(){
    const now = new Date();
    const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    document.getElementById('fecha-header').textContent =
      dias[now.getDay()] + ' ' + pad(now.getDate()) + ' ' + meses[now.getMonth()] + ' — ' +
      pad(now.getHours()) + ':' + pad(now.getMinutes());
    document.getElementById('timestamp-bar').textContent =
      '⏱ ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  }
  updateTime();
  setInterval(updateTime, 1000);

  function selCamion(btn){
    document.querySelectorAll('.camion-btn[data-camion]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    camionSel = btn.dataset.camion;
    // Ocultar el camión activo del selector "otro camión"
    document.querySelectorAll('.camion-btn[data-otro]').forEach(b => {
      b.style.display = (b.dataset.otro === camionSel) ? 'none' : '';
    });
    actualizarPreview();
    checkSubmit();
  }

  function selOtroCamion(btn){
    document.querySelectorAll('.camion-btn[data-otro]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    otroCamionSel = btn.dataset.otro;
    actualizarPreview();
    checkSubmit();
  }

  function selTipo(btn){
    document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tipoSel = btn.dataset.tipo;

    const extra = document.getElementById('extra-fields');
    const traslado = document.getElementById('traslado-fields');
    const trasladoTitulo = document.getElementById('traslado-titulo');
    const obsLabel = document.getElementById('obs-label');

    extra.classList.remove('visible');
    traslado.classList.remove('visible');
    otroCamionSel = null;
    document.querySelectorAll('.camion-btn[data-otro]').forEach(b => b.classList.remove('active'));

    if(tipoSel === 'venta'){
      extra.classList.add('visible');
      obsLabel.textContent = '6. Observación (opcional)';
    } else if(tipoSel === 'traslado_sale'){
      traslado.classList.add('visible');
      trasladoTitulo.textContent = '¿A qué destino ENTREGAS?';
      obsLabel.textContent = '5. Observación (opcional)';
    } else if(tipoSel === 'traslado_entra'){
      traslado.classList.add('visible');
      trasladoTitulo.textContent = '¿De qué origen RECIBES?';
      obsLabel.textContent = '5. Observación (opcional)';
    } else {
      obsLabel.textContent = '4. Observación (opcional)';
      document.getElementById('factura').value = '';
      document.getElementById('cliente').value = '';
    }
    actualizarPreview();
    checkSubmit();
  }

  function actualizarPreview(){
    const litros = document.getElementById('litros').value;
    const factura = document.getElementById('factura').value;
    const cliente = document.getElementById('cliente').value;
    const obs = document.getElementById('observacion').value;
    const preview = document.getElementById('preview-box');
    const content = document.getElementById('preview-content');

    if(!camionSel || !tipoSel || !litros){ preview.classList.remove('visible'); return; }

    const tipoTexto = {
      inicio: '🟣 INICIO DÍA', carga: '🔵 CARGA ENAP',
      venta: '🟠 VENTA',
      traslado_sale: '🟡 TRASLADO − (entrego)',
      traslado_entra: '🟢 TRASLADO + (recibo)',
      cierre: '🟢 CIERRE DÍA'
    }[tipoSel];

    let html = `<span>${camionSel}</span> · ${tipoTexto}<br>`;
    html += `Litros: <span>${formatearMiles(litros)}</span>`;
    if(tipoSel === 'venta'){
      if(factura) html += `<br>Fact: <span>${factura}</span>`;
      if(cliente) html += `<br>Cliente: <span>${cliente}</span>`;
    }
    if(tipoSel === 'traslado_sale' && otroCamionSel) html += `<br>A: <span>${otroCamionSel}</span>`;
    if(tipoSel === 'traslado_entra' && otroCamionSel) html += `<br>De: <span>${otroCamionSel}</span>`;
    if(obs) html += `<br>Obs: ${obs}`;

    content.innerHTML = html;
    preview.classList.add('visible');
    checkSubmit();
  }

  function checkSubmit(){
    const litros = document.getElementById('litros').value;
    const btn = document.getElementById('submit-btn');
    const trasladoOK = (tipoSel !== 'traslado_sale' && tipoSel !== 'traslado_entra') || otroCamionSel;
    btn.disabled = !(camionSel && tipoSel && litros && parseInt(litros, 10) > 0 && trasladoOK);
  }

  function enviar(){
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'ENVIANDO...';

    const now = new Date();
    const litrosInt = parseInt(document.getElementById('litros').value, 10);

    const tipoGuardar = {
      inicio: 'INICIO', carga: 'CARGA', venta: 'VENTA',
      traslado_sale: 'TRASLADO ENVIADO',
      traslado_entra: 'TRASLADO RECIBIDO',
      cierre: 'CIERRE'
    }[tipoSel];

    let obs = document.getElementById('observacion').value || '';
    if(tipoSel === 'traslado_sale' && otroCamionSel)  obs = `→ ${otroCamionSel}` + (obs ? ' | ' + obs : '');
    if(tipoSel === 'traslado_entra' && otroCamionSel) obs = `← ${otroCamionSel}` + (obs ? ' | ' + obs : '');

    const data = {
      camion: camionSel,
      tipo: tipoGuardar,
      litros: litrosInt,
      factura: document.getElementById('factura').value || '',
      cliente: document.getElementById('cliente').value || '',
      observacion: obs,
      fecha: pad(now.getDate()) + '/' + pad(now.getMonth()+1) + '/' + now.getFullYear(),
      hora: pad(now.getHours()) + ':' + pad(now.getMinutes())
    };

    // Envío sin CORS: cargamos el JSON en el campo hidden "payload" y hacemos
    // submit nativo del form hacia el iframe oculto. No se espera respuesta,
    // así que Google no bloquea nada. Mostramos "REGISTRADO" de inmediato.
    document.getElementById('payload-input').value = JSON.stringify(data);
    document.getElementById('envio-form').submit();
    mostrarExito(data);
  }

  function mostrarExito(data){
    document.getElementById('main-form').style.display = 'none';
    const tipoTexto = {
      'INICIO': '🟣 INICIO DÍA', 'CARGA': '🔵 CARGA ENAP', 'VENTA': '🟠 VENTA',
      'TRASLADO ENVIADO': '🟡 TRASLADO − (entregué)',
      'TRASLADO RECIBIDO': '🟢 TRASLADO + (recibí)',
      'CIERRE': '🟢 CIERRE DÍA'
    }[data.tipo] || data.tipo;
    let detalle = `Camión: ${data.camion}\nTipo: ${tipoTexto}\nLitros: ${formatearMiles(data.litros)}\nHora: ${data.hora}`;
    if(data.factura) detalle += `\nFactura: ${data.factura}`;
    if(data.cliente) detalle += `\nCliente: ${data.cliente}`;
    if(data.observacion) detalle += `\nObs: ${data.observacion}`;
    document.getElementById('success-detail').style.whiteSpace = 'pre-line';
    document.getElementById('success-detail').textContent = detalle;
    document.getElementById('success-screen').classList.add('visible');
  }

  function nuevoReporte(){
    document.getElementById('main-form').style.display = 'block';
    document.getElementById('success-screen').classList.remove('visible');
    document.querySelectorAll('.camion-btn, .tipo-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.camion-btn[data-otro]').forEach(b => b.style.display = '');
    document.getElementById('litros').value = '';
    document.getElementById('factura').value = '';
    document.getElementById('cliente').value = '';
    document.getElementById('observacion').value = '';
    document.getElementById('extra-fields').classList.remove('visible');
    document.getElementById('traslado-fields').classList.remove('visible');
    document.getElementById('preview-box').classList.remove('visible');
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('submit-btn').textContent = 'ENVIAR REPORTE';
    document.getElementById('obs-label').textContent = '4. Observación (opcional)';
    camionSel = null;
    tipoSel = null;
    otroCamionSel = null;
    window.scrollTo(0,0);
  }
</script>
</body>
</html>
