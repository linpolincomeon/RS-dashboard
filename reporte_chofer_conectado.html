<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TomEnergy — Reporte Bodega</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --negro: #0D0D0D;
    --gris-oscuro: #1A1A1A;
    --gris-medio: #2A2A2A;
    --gris-borde: #333;
    --blanco: #F5F5F0;
    --blanco-suave: #CCCCCC;
    --amarillo: #F5C400;
    --rojo: #E03030;
    --azul: #2E6FD4;
    --verde: #2EAA5A;
    --naranja: #E07820;
    --violeta: #8B5CF6;
    --cyan: #2EBFD4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--negro);
    color: var(--blanco);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* HEADER */
  .header {
    background: var(--gris-oscuro);
    border-bottom: 3px solid var(--amarillo);
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo-badge {
    background: var(--amarillo);
    color: var(--negro);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 13px;
    padding: 4px 8px;
    letter-spacing: 1px;
    flex-shrink: 0;
  }
  .header-text h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.5px;
    line-height: 1;
  }
  .header-text p {
    font-size: 11px;
    color: var(--blanco-suave);
    margin-top: 2px;
  }

  /* FORM */
  .container { padding: 20px 16px; max-width: 480px; margin: 0 auto; }

  .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--amarillo);
    text-transform: uppercase;
    margin-bottom: 8px;
    margin-top: 24px;
  }

  /* CAMION SELECTOR */
  .camion-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .camion-btn {
    background: var(--gris-medio);
    border: 2px solid var(--gris-borde);
    color: var(--blanco-suave);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 4px;
    line-height: 1.2;
  }
  .camion-btn .placa {
    display: block;
    font-size: 22px;
    font-weight: 900;
    color: var(--blanco);
    letter-spacing: 1px;
  }
  .camion-btn .nombre {
    display: block;
    font-size: 11px;
    color: var(--blanco-suave);
    font-weight: 400;
    margin-top: 2px;
  }
  .camion-btn.active {
    border-color: var(--amarillo);
    background: #2A2500;
    color: var(--amarillo);
  }
  .camion-btn.active .placa { color: var(--amarillo); }
  .camion-btn.active .nombre { color: #AA8800; }
  .camion-btn:active { transform: scale(0.97); }
  .camion-btn-small { padding: 10px 8px; }
  .camion-btn-small .placa { font-size: 18px; }
  .camion-btn-small .nombre { font-size: 10px; }

  /* TIPO MOVIMIENTO */
  .tipo-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tipo-btn {
    background: var(--gris-medio);
    border: 2px solid var(--gris-borde);
    color: var(--blanco);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.15s;
  }
  .tipo-btn .icono { font-size: 22px; flex-shrink: 0; }
  .tipo-btn .tipo-desc { font-size: 11px; font-weight: 400; color: var(--blanco-suave); display: block; margin-top: 1px; font-family: 'Barlow', sans-serif; }
  .tipo-btn:active { transform: scale(0.98); }

  .tipo-btn[data-tipo="inicio"].active         { border-color: var(--violeta); background: #1A1030; }
  .tipo-btn[data-tipo="carga"].active          { border-color: var(--azul);    background: #0A1830; }
  .tipo-btn[data-tipo="venta"].active          { border-color: var(--naranja); background: #201008; }
  .tipo-btn[data-tipo="traslado_sale"].active  { border-color: #CCA000;        background: #1E1800; }
  .tipo-btn[data-tipo="traslado_entra"].active { border-color: var(--cyan);    background: #08202A; }
  .tipo-btn[data-tipo="cierre"].active         { border-color: var(--verde);   background: #081808; }

  /* TRASLADO FIELDS (selector de otro camión, aparece solo en traslados) */
  .traslado-fields {
    display: none;
    margin-top: 16px;
    padding: 14px;
    background: #1A1500;
    border: 1px dashed #CCA000;
    border-radius: 4px;
  }
  .traslado-fields.visible { display: block; }
  .traslado-titulo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--amarillo);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* INPUTS */
  .input-group { margin-top: 8px; }
  .input-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--blanco-suave);
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }
  input[type="number"], input[type="text"], input[type="tel"] {
    width: 100%;
    background: var(--gris-medio);
    border: 2px solid var(--gris-borde);
    color: var(--blanco);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 28px;
    padding: 14px 16px;
    border-radius: 4px;
    outline: none;
    appearance: none;
    -moz-appearance: textfield;
  }
  input[type="number"]:focus, input[type="text"]:focus, input[type="tel"]:focus {
    border-color: var(--amarillo);
    background: #1A1800;
  }
  input::placeholder { color: #555; font-weight: 400; font-size: 20px; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  input.input-small {
    font-size: 20px;
    padding: 12px 16px;
  }

  /* CAMPOS EXTRA - ocultos por defecto */
  .extra-fields {
    display: none;
    flex-direction: column;
    gap: 16px;
    margin-top: 0;
  }
  .extra-fields.visible { display: flex; }

  /* DIVIDER */
  .divider {
    height: 1px;
    background: var(--gris-borde);
    margin: 24px 0 0;
  }

  /* SUBMIT */
  .submit-btn {
    width: 100%;
    background: var(--amarillo);
    color: var(--negro);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 1px;
    padding: 18px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 24px;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .submit-btn:active { transform: scale(0.98); background: #D4A900; }
  .submit-btn:disabled { background: #444; color: #777; cursor: not-allowed; }

  /* PREVIEW */
  .preview-box {
    background: var(--gris-medio);
    border: 1px solid var(--gris-borde);
    border-radius: 4px;
    padding: 14px 16px;
    margin-top: 16px;
    display: none;
  }
  .preview-box.visible { display: block; }
  .preview-box .preview-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--blanco-suave);
    text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
    margin-bottom: 6px;
  }
  .preview-box .preview-content {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--blanco);
    line-height: 1.6;
  }
  .preview-box .preview-content span { color: var(--amarillo); }

  /* SUCCESS */
  .success-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .success-screen.visible { display: block; }
  .success-icon { font-size: 64px; margin-bottom: 16px; }
  .success-screen h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--verde);
    margin-bottom: 8px;
  }
  .success-screen p { color: var(--blanco-suave); margin-bottom: 24px; }
  .success-detail {
    background: var(--gris-medio);
    border-left: 4px solid var(--verde);
    padding: 14px 16px;
    text-align: left;
    border-radius: 0 4px 4px 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    margin-bottom: 24px;
    line-height: 1.8;
  }
  .nuevo-btn {
    background: transparent;
    border: 2px solid var(--amarillo);
    color: var(--amarillo);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    padding: 14px 32px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
  }

  /* TIMESTAMP */
  .timestamp-bar {
    background: var(--gris-oscuro);
    border-top: 1px solid var(--gris-borde);
    padding: 8px 20px;
    font-size: 11px;
    color: #555;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-badge">TOM<br>ENERGY</div>
  <div class="header-text">
    <h1>REPORTE BODEGA</h1>
    <p id="fecha-header">Cargando fecha...</p>
  </div>
</div>

<div class="container" id="main-form">

  <!-- CAMIÓN -->
  <div class="section-label">1. Tu camión</div>
  <div class="camion-grid">
    <button class="camion-btn" data-camion="PY" onclick="selCamion(this)">
      <span class="placa">PY</span>
    </button>
    <button class="camion-btn" data-camion="SH" onclick="selCamion(this)">
      <span class="placa">SH</span>
    </button>
    <button class="camion-btn" data-camion="VD" onclick="selCamion(this)">
      <span class="placa">VD</span>
    </button>
    <button class="camion-btn" data-camion="PH" onclick="selCamion(this)">
      <span class="placa">PH</span>
    </button>
    <button class="camion-btn" data-camion="TJ" onclick="selCamion(this)">
      <span class="placa">TJ</span>
    </button>
    <button class="camion-btn" data-camion="HH" onclick="selCamion(this)">
      <span class="placa">HH</span>
    </button>
    <button class="camion-btn" style="grid-column: span 2;" data-camion="TY" onclick="selCamion(this)">
      <span class="placa">TY</span>
    </button>
  </div>

  <!-- TIPO -->
  <div class="section-label">2. Tipo de movimiento</div>
  <div class="tipo-grid">
    <button class="tipo-btn" data-tipo="inicio" onclick="selTipo(this)">
      <span class="icono">🟣</span>
      <div>
        INICIO DEL DÍA
        <span class="tipo-desc">Saldo con que arrancas la jornada</span>
      </div>
    </button>
    <button class="tipo-btn" data-tipo="carga" onclick="selTipo(this)">
      <span class="icono">🔵</span>
      <div>
        CARGA ENAP
        <span class="tipo-desc">Litros cargados en planta (saldo previo = 0)</span>
      </div>
    </button>
    <button class="tipo-btn" data-tipo="venta" onclick="selTipo(this)">
      <span class="icono">🟠</span>
      <div>
        VENTA
        <span class="tipo-desc">Despacho a cliente con factura</span>
      </div>
    </button>
    <button class="tipo-btn" data-tipo="traslado_sale" onclick="selTipo(this)">
      <span class="icono">🟡</span>
      <div>
        TRASLADO −
        <span class="tipo-desc">ENTREGO litros a otro camión (resta)</span>
      </div>
    </button>
    <button class="tipo-btn" data-tipo="traslado_entra" onclick="selTipo(this)">
      <span class="icono">🟢</span>
      <div>
        TRASLADO +
        <span class="tipo-desc">RECIBO litros de otro camión (suma)</span>
      </div>
    </button>
    <button class="tipo-btn" data-tipo="cierre" onclick="selTipo(this)">
      <span class="icono">🟢</span>
      <div>
        CIERRE DEL DÍA
        <span class="tipo-desc">Saldo final al terminar la jornada</span>
      </div>
    </button>
  </div>



  <!-- OTRO CAMIÓN (solo se muestra en traslados) -->
  <div class="traslado-fields" id="traslado-fields">
    <div class="traslado-titulo" id="traslado-titulo">¿A qué camión?</div>
    <div class="camion-grid">
      <button class="camion-btn camion-btn-small" data-otro="PY" onclick="selOtroCamion(this)"><span class="placa">PY</span></button>
      <button class="camion-btn camion-btn-small" data-otro="SH" onclick="selOtroCamion(this)"><span class="placa">SH</span></button>
      <button class="camion-btn camion-btn-small" data-otro="VD" onclick="selOtroCamion(this)"><span class="placa">VD</span></button>
      <button class="camion-btn camion-btn-small" data-otro="PH" onclick="selOtroCamion(this)"><span class="placa">PH</span></button>
      <button class="camion-btn camion-btn-small" data-otro="TJ" onclick="selOtroCamion(this)"><span class="placa">TJ</span></button>
      <button class="camion-btn camion-btn-small" data-otro="HH" onclick="selOtroCamion(this)"><span class="placa">HH</span></button>
      <button class="camion-btn camion-btn-small" data-otro="TY" onclick="selOtroCamion(this)"><span class="placa">TY</span></button>
    </div>
  </div>

  <!-- LITROS -->
  <div class="section-label">3. Litros</div>
  <div class="input-group">
    <input type="tel" id="litros" placeholder="0" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           oninput="limpiarLitros(this); actualizarPreview()">
  </div>

  <!-- CAMPOS EXTRA (solo ventas) -->
  <div class="extra-fields" id="extra-fields">
    <div>
      <div class="section-label">4. N° Factura</div>
      <div class="input-group">
        <input type="text" id="factura" class="input-small" placeholder="52xxx"
               inputmode="numeric" oninput="actualizarPreview()">
      </div>
    </div>
    <div>
      <div class="section-label">5. Cliente (opcional)</div>
      <div class="input-group">
        <input type="text" id="cliente" class="input-small" placeholder="Nombre cliente (opcional)"
               oninput="actualizarPreview()">
      </div>
    </div>
  </div>

  <!-- OBSERVACIÓN -->
  <div class="section-label" id="obs-label">4. Observación (opcional)</div>
  <div class="input-group">
    <input type="text" id="observacion" class="input-small" placeholder="Ej: rotura manguera, traslado desde SH..."
           oninput="actualizarPreview()">
  </div>

  <!-- PREVIEW -->
  <div class="preview-box" id="preview-box">
    <div class="preview-label">Vista previa del reporte</div>
    <div class="preview-content" id="preview-content"></div>
  </div>

  <div class="divider"></div>
  <button class="submit-btn" id="submit-btn" onclick="enviar()" disabled>ENVIAR REPORTE</button>

</div>

<!-- SUCCESS SCREEN -->
<div class="container success-screen" id="success-screen">
  <div class="success-icon">✅</div>
  <h2>REGISTRADO</h2>
  <p>Tu reporte fue guardado correctamente.</p>
  <div class="success-detail" id="success-detail"></div>
  <button class="nuevo-btn" onclick="nuevoReporte()">+ NUEVO MOVIMIENTO</button>
</div>

<div class="timestamp-bar" id="timestamp-bar">⏱ —</div>

<script>
  let camionSel = null;
  let tipoSel = null;
  let otroCamionSel = null;
  const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbyEEI4ujT7TVXhYMJPWtDskgvpDO-f5ZNJCPnmM4me11u2PSkiu9LmB8pPFzJI9xWak/exec';

  function pad(n){ return n.toString().padStart(2,'0'); }

  function limpiarLitros(input){
    input.value = input.value.replace(/\D/g, '');
  }

  function formatearMiles(n){
    return Number(n).toLocaleString('es-CL').replace(/,/g, '.');
  }

  function updateTime(){
    const now = new Date();
    const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    document.getElementById('fecha-header').textContent =
      dias[now.getDay()] + ' ' + pad(now.getDate()) + ' ' + meses[now.getMonth()] + ' — ' +
      pad(now.getHours()) + ':' + pad(now.getMinutes());
    document.getElementById('timestamp-bar').textContent =
      '⏱ ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  }
  updateTime();
  setInterval(updateTime, 1000);

  function selCamion(btn){
    document.querySelectorAll('.camion-btn[data-camion]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    camionSel = btn.dataset.camion;
    // Ocultar el camión seleccionado del selector "otro camión"
    document.querySelectorAll('.camion-btn[data-otro]').forEach(b => {
      b.style.display = (b.dataset.otro === camionSel) ? 'none' : '';
    });
    actualizarPreview();
    checkSubmit();
  }

  function selOtroCamion(btn){
    document.querySelectorAll('.camion-btn[data-otro]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    otroCamionSel = btn.dataset.otro;
    actualizarPreview();
    checkSubmit();
  }

  function selTipo(btn){
    document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tipoSel = btn.dataset.tipo;

    const extra = document.getElementById('extra-fields');
    const traslado = document.getElementById('traslado-fields');
    const trasladoTitulo = document.getElementById('traslado-titulo');
    const obsLabel = document.getElementById('obs-label');

    // Reset campos contextuales
    extra.classList.remove('visible');
    traslado.classList.remove('visible');
    otroCamionSel = null;
    document.querySelectorAll('.camion-btn[data-otro]').forEach(b => b.classList.remove('active'));

    if(tipoSel === 'venta'){
      extra.classList.add('visible');
      obsLabel.textContent = '6. Observación (opcional)';
    } else if(tipoSel === 'traslado_sale'){
      traslado.classList.add('visible');
      trasladoTitulo.textContent = '¿A qué camión ENTREGAS?';
      obsLabel.textContent = '5. Observación (opcional)';
    } else if(tipoSel === 'traslado_entra'){
      traslado.classList.add('visible');
      trasladoTitulo.textContent = '¿De qué camión RECIBES?';
      obsLabel.textContent = '5. Observación (opcional)';
    } else {
      obsLabel.textContent = '4. Observación (opcional)';
      document.getElementById('factura').value = '';
      document.getElementById('cliente').value = '';
    }
    actualizarPreview();
    checkSubmit();
  }

  function actualizarPreview(){
    const litros = document.getElementById('litros').value;
    const factura = document.getElementById('factura').value;
    const cliente = document.getElementById('cliente').value;
    const obs = document.getElementById('observacion').value;
    const preview = document.getElementById('preview-box');
    const content = document.getElementById('preview-content');

    if(!camionSel || !tipoSel || !litros){ preview.classList.remove('visible'); return; }

    const tipoTexto = {
      inicio: '🟣 INICIO DÍA', carga: '🔵 CARGA ENAP',
      venta: '🟠 VENTA',
      traslado_sale: '🟡 TRASLADO − (entrego)',
      traslado_entra: '🟢 TRASLADO + (recibo)',
      cierre: '🟢 CIERRE DÍA'
    }[tipoSel];

    let html = `<span>${camionSel}</span> · ${tipoTexto}<br>`;
    html += `Litros: <span>${formatearMiles(litros)}</span>`;
    if(tipoSel === 'venta'){
      if(factura) html += `<br>Fact: <span>${factura}</span>`;
      if(cliente) html += `<br>Cliente: <span>${cliente}</span>`;
    }
    if(tipoSel === 'traslado_sale' && otroCamionSel) html += `<br>A: <span>${otroCamionSel}</span>`;
    if(tipoSel === 'traslado_entra' && otroCamionSel) html += `<br>De: <span>${otroCamionSel}</span>`;
    if(obs) html += `<br>Obs: ${obs}`;

    content.innerHTML = html;
    preview.classList.add('visible');
    checkSubmit();
  }

  function checkSubmit(){
    const litros = document.getElementById('litros').value;
    const btn = document.getElementById('submit-btn');
    // Si es traslado, requiere también otro camión seleccionado
    const trasladoOK = (tipoSel !== 'traslado_sale' && tipoSel !== 'traslado_entra') || otroCamionSel;
    btn.disabled = !(camionSel && tipoSel && litros && parseInt(litros, 10) > 0 && trasladoOK);
  }

  function enviar(){
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'ENVIANDO...';

    const now = new Date();
    const litrosInt = parseInt(document.getElementById('litros').value, 10);

    // Mapear tipo interno -> nombre en el Sheet
    const tipoGuardar = {
      inicio: 'INICIO', carga: 'CARGA', venta: 'VENTA',
      traslado_sale: 'TRASLADO ENVIADO',
      traslado_entra: 'TRASLADO RECIBIDO',
      cierre: 'CIERRE'
    }[tipoSel];

    // Si es traslado, anteponer destino/origen a la observación
    let obs = document.getElementById('observacion').value || '';
    if(tipoSel === 'traslado_sale' && otroCamionSel)  obs = `→ ${otroCamionSel}` + (obs ? ' | ' + obs : '');
    if(tipoSel === 'traslado_entra' && otroCamionSel) obs = `← ${otroCamionSel}` + (obs ? ' | ' + obs : '');

    const data = {
      timestamp: now.toISOString(),
      fecha: pad(now.getDate()) + '/' + pad(now.getMonth()+1) + '/' + now.getFullYear(),
      hora: pad(now.getHours()) + ':' + pad(now.getMinutes()),
      camion: camionSel,
      tipo: tipoGuardar,
      litros: litrosInt,
      factura: document.getElementById('factura').value || '',
      cliente: document.getElementById('cliente').value || '',
      observacion: obs
    };

    fetch(WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(data)
    }).then(() => mostrarExito(data))
      .catch(() => mostrarExito(data));
  }

  function mostrarExito(data){
    document.getElementById('main-form').style.display = 'none';
    const tipoTexto = {
      'INICIO': '🟣 INICIO DÍA', 'CARGA': '🔵 CARGA ENAP', 'VENTA': '🟠 VENTA',
      'TRASLADO ENVIADO': '🟡 TRASLADO − (entregué)',
      'TRASLADO RECIBIDO': '🟢 TRASLADO + (recibí)',
      'CIERRE': '🟢 CIERRE DÍA'
    }[data.tipo] || data.tipo;
    let detalle = `Camión: ${data.camion}\nTipo: ${tipoTexto}\nLitros: ${formatearMiles(data.litros)}\nHora: ${data.hora}`;
    if(data.factura) detalle += `\nFactura: ${data.factura}`;
    if(data.cliente) detalle += `\nCliente: ${data.cliente}`;
    if(data.observacion) detalle += `\nObs: ${data.observacion}`;
    document.getElementById('success-detail').style.whiteSpace = 'pre-line';
    document.getElementById('success-detail').textContent = detalle;
    document.getElementById('success-screen').classList.add('visible');
  }

  function nuevoReporte(){
    document.getElementById('main-form').style.display = 'block';
    document.getElementById('success-screen').classList.remove('visible');
    document.querySelectorAll('.camion-btn, .tipo-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.camion-btn[data-otro]').forEach(b => b.style.display = '');
    document.getElementById('litros').value = '';
    document.getElementById('factura').value = '';
    document.getElementById('cliente').value = '';
    document.getElementById('observacion').value = '';
    document.getElementById('extra-fields').classList.remove('visible');
    document.getElementById('traslado-fields').classList.remove('visible');
    document.getElementById('preview-box').classList.remove('visible');
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('submit-btn').textContent = 'ENVIAR REPORTE';
    document.getElementById('obs-label').textContent = '4. Observación (opcional)';
    camionSel = null;
    tipoSel = null;
    otroCamionSel = null;
    window.scrollTo(0,0);
  }
</script>
</body>
</html>
