name: Update CRM Dashboard Data
on:
  schedule:
    - cron: '13 1 * * *'   # 22:13 Chile (verano) / 21:13 (invierno) — minuto impar para esquivar la cola de GitHub
    - cron: '0 14 * * 5'    # VIERNES — 11:00 Chile desde el cambio de hora (era 10:00 en invierno)
    - cron: '50 14 * * 5'   # VIERNES — 11:50 Chile desde el cambio de hora (era 10:50 en invierno)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odoo-extractors      # compartido por los 4: nunca dos contra Odoo a la vez
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch CRM data from Odoo
        env:
          ODOO_URL: https://tomenergy.cl
          ODOO_DB: PRODUCCION
          ODOO_USER: p@tomenergy.cl
          ODOO_KEY: ${{ secrets.ODOO_KEY }}
        run: python extract_crm.py
      - name: Validar plausibilidad del output
        run: python validate_data.py crm-data.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crm-data.json plazos-snapshot.json mix-snapshot.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update CRM data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
