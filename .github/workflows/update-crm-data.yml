name: Update CRM Dashboard Data
on:
  schedule:
    - cron: '0 10 * * *'    # ~6-8 AM Chile (con drift de GitHub) — evita ventana de mantención de Odoo ~05:50, escalonado tras Route/CEO
    - cron: '0 14 * * 5'    # VIERNES 10:00 AM Chile — dato fresco 1h antes de reunion
    - cron: '50 14 * * 5'   # VIERNES 10:50 AM Chile — refresco final 10 min antes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch CRM data from Odoo
        env:
          ODOO_URL: https://tomenergy.cl
          ODOO_DB: PRODUCCION
          ODOO_USER: p@tomenergy.cl
          ODOO_KEY: ${{ secrets.ODOO_KEY }}
        run: python extract_crm.py
      - name: Validar plausibilidad del output
        run: python validate_data.py crm-data.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crm-data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update CRM data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
