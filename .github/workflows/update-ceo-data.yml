name: Update CEO Data
on:
  schedule:
    - cron: '30 7 * * *'      # 3:30 AM Chile (UTC-4) — escalonado tras Route (3:00)
  workflow_dispatch:           # trigger manual
permissions:
  contents: write              # imprescindible para que el bot haga push
concurrency:
  group: update-ceo-data       # evita que dos runs se pisen
  cancel-in-progress: false
jobs:
  update-ceo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # historial completo: necesario para pull --rebase
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run extractor
        env:                     # env al STEP, no al job
          ODOO_URL: https://tomenergy.cl
          ODOO_DB: PRODUCCION
          ODOO_USER: p@tomenergy.cl
          ODOO_KEY: ${{ secrets.ODOO_KEY }}
        run: python extract_ceo.py
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update CEO data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin main
          git push
