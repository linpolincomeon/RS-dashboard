<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomEnergy — CEO Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            color-scheme: light;
            --accent: #c8360e;
            --accent-light: #fce5d8;
            --blue: #1a5fb4;
            --green: #0f6e56;
            --amber: #854f0b;
            --red: #a32d2d;
            --purple: #6b3fa0;
            --teal: #0f7b6c;
            --bg: #fafaf8;
            --surface: #fff;
            --surface2: #f5f5f3;
            --border: #e8e8e6;
            --text: #1a1a18;
            --text2: #5a5a56;
            --text3: #9c9b96;
        }
        body {
            font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        .c-accent { --accent-fg: var(--accent); }
        .c-blue { --accent-fg: var(--blue); }
        .c-green { --accent-fg: var(--green); }
        .c-amber { --accent-fg: var(--amber); }
        .c-red { --accent-fg: var(--red); }
        .c-purple { --accent-fg: var(--purple); }
        .c-teal { --accent-fg: var(--teal); }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .header-right {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .timestamp {
            font-size: 12px;
            color: var(--text3);
        }
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            gap: 2rem;
        }
        .tab {
            background: none;
            border: none;
            padding: 12px 0;
            font-size: 14px;
            font-weight: 500;
            color: var(--text2);
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab:hover { color: var(--text); }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            padding: 1rem 2rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .wf {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s;
        }
        .wf:hover { background: var(--border); }
        .wf.on {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .fl {
            font-size: 13px;
            color: var(--text3);
            font-weight: 500;
        }
        main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        #loading {
            text-align: center;
            padding: 3rem;
            font-size: 14px;
            color: var(--text3);
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .kpi::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-fg, var(--accent));
        }
        .kpi-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        .kpi-val {
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
        .kpi-delta {
            font-size: 12px;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        .kpi-delta.up { color: var(--green); }
        .kpi-delta.dn { color: var(--red); }
        .kpi-sub {
            font-size: 11px;
            color: var(--text3);
            margin-top: 0.5rem;
        }
        .section-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 2rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
        }
        .chart-row {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .chart-row.two { grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); }
        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
        }
        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .badge {
            font-size: 11px;
            font-weight: 500;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .chart-wrap {
            position: relative;
            height: 300px;
        }
        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead {
            background: var(--surface2);
        }
        th {
            padding: 12px 8px;
            text-align: left;
            font-weight: 600;
            color: var(--text2);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        th.r {
            text-align: right;
        }
        td {
            padding: 10px 8px;
            border-top: 1px solid var(--border);
        }
        td.r {
            text-align: right;
            font-weight: 500;
        }
        td.hi {
            font-weight: 600;
            color: var(--accent);
        }
        td.ok {
            color: var(--green);
            font-weight: 500;
        }
        td.bad {
            color: var(--red);
            font-weight: 500;
        }
        .note {
            font-size: 11px;
            color: var(--text3);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        /* Score badges */
        .sbadge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;min-width:36px;text-align:center}
        .sbadge.s-critico{background:#fcebeb;color:#a32d2d}
        .sbadge.s-alto{background:#faeeda;color:#854f0b}
        .sbadge.s-medio{background:#e8f0fc;color:#1a5fb4}
        .sbadge.s-bajo{background:#e1f5ee;color:#0f6e56}
        /* Scrollable table with proper sticky headers */
        .table-scroll{max-height:500px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:1.5rem}
        .table-scroll table{margin:0}
        .table-scroll thead th{position:sticky;top:0;background:var(--surface2);z-index:3;box-shadow:0 1px 0 var(--border)}
        footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 1rem 2rem;
            text-align: center;
            font-size: 11px;
            color: var(--text3);
            margin-top: 3rem;
        }
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1rem; }
            nav { flex-wrap: wrap; }
            .controls { flex-direction: column; align-items: flex-start; }
            .chart-row.two { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: 1fr; }
        }
        /* ── Cash Flow ── */
        .cf-params{display:flex;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:8px}
        .cf-param{display:flex;flex-direction:column;gap:4px;min-width:180px}
        .cf-param label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px}
        .cf-param input{font-family:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);width:100%;box-sizing:border-box}
        .cf-param input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
        .cf-hint{font-size:10px;color:var(--text3);font-style:italic}
        .cf-diag{margin-top:8px}
        .cf-ok,.cf-warn,.cf-bad{padding:14px 18px;border-radius:8px;border-left:4px solid;font-size:13px;line-height:1.5}
        .cf-ok{background:rgba(15,110,86,0.06);border-left-color:var(--green);color:var(--text)}
        .cf-warn{background:rgba(133,79,11,0.07);border-left-color:var(--amber);color:var(--text)}
        .cf-bad{background:rgba(163,45,45,0.07);border-left-color:var(--red);color:var(--text)}
        .cf-row-proj{background:rgba(255,200,100,0.10)!important;font-weight:600}
        .cf-row-next{background:rgba(100,180,255,0.08)!important;font-weight:600}
    </style>
</head>
<body>
    <header>
        <h1><strong>TomEnergy</strong> CEO Dashboard</h1>
        <div class="header-right">
            <div class="timestamp"><span id="timestamp">Cargando...</span></div>
            <button class="btn" onclick="location.reload()">Actualizar</button>
        </div>
    </header>
    <nav id="tabs"></nav>
    <div class="controls" id="filters"></div>
    <main id="main" style="display: none;">
        <div id="p-ventas" class="panel"></div>
        <div id="p-gerencia" class="panel"></div>
        <div id="p-resumen" class="panel"></div>
        <div id="p-operaciones" class="panel"></div>
        <div id="p-riesgo" class="panel"></div>
        <div id="p-cashflow" class="panel"></div>
    </main>
    <div id="loading" style="text-align: center; padding: 3rem;">
        <div style="color: var(--text3);">Cargando datos...</div>
    </div>
    <footer id="ftr">TomEnergy · CEO Dashboard</footer>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
let D=null, curTab='ventas', fN=16, selW=0;
const charts={};
const C={accent:'#c8360e',blue:'#1a5fb4',green:'#0f6e56',amber:'#854f0b',red:'#a32d2d',purple:'#6b3fa0',teal:'#0f7b6c'};
const fM=n=>!n&&n!==0?'—':'$'+(n/1e6).toFixed(1)+'M';
const fK=n=>!n&&n!==0?'—':Math.round(n/1000).toLocaleString('es-CL')+'K';
const fNum=n=>!n&&n!==0?'—':Math.round(n).toLocaleString('es-CL');
const fP=n=>!n&&n!==0?'—':(n*100).toFixed(1)+'%';
const pD=(c,p)=>(!c||!p)?null:((c-p)/Math.abs(p))*100;
const dH=d=>{if(d==null)return'';const u=d>=0;return`<div class="kpi-delta ${u?'up':'dn'}">${u?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</div>`};
function setupTabs(){
    const tabDefs=[['ventas','RS'],['gerencia','Gerencia'],['resumen','Resumen'],['operaciones','Operaciones'],['riesgo','⚠️ Riesgo'],['cashflow','💰 Cash Flow']];
    document.getElementById('tabs').innerHTML=tabDefs.map(([k,l])=>
        `<button class="tab ${k===curTab?'active':''}" onclick="switchTab('${k}')">${l}</button>`
    ).join('');
    if(curTab==='ventas'||curTab==='gerencia'||curTab==='resumen'||curTab==='operaciones'){
        const ws=D.weeks[selW];
        document.getElementById('filters').innerHTML=[4,8,16].map(n=>
            `<button class="wf ${fN===n?'on':''}" onclick="setFilter(${n})">${n}S</button>`
        ).join('')+`<span class="fl">${ws.label}${ws.parcial?' (parcial)':''} · Jue→Mié</span>`
        +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;width:100%">'
        +D.weeks.slice(0,fN).map((w,i)=>
            `<button class="wf${i===selW?' on':''}" onclick="selectWeek(${i})" style="font-size:10px;padding:3px 8px">${w.label}${w.parcial?' *':''}</button>`
        ).join('')+'</div>';
    } else {
        document.getElementById('filters').innerHTML='';
    }
}
function switchTab(t){
    curTab=t;
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('p-'+t).classList.add('active');
    setupTabs();
    render();
}
function setFilter(n){fN=n;if(selW>=n)selW=0;render()}
function selectWeek(i){selW=i;render()}
function render(){
    if(curTab==='ventas') renderVentas();
    else if(curTab==='gerencia') renderGerencia();
    else if(curTab==='resumen') renderResumen();
    else if(curTab==='operaciones') renderOperaciones();
    else if(curTab==='riesgo') renderRiesgo();
    else if(curTab==='cashflow') renderCashflow();
    setupTabs();
}
// ── RS (was Ventas) ──
function renderVentas(){
    const el=document.getElementById('p-ventas');
    const wk=[...D.weeks.slice(0,fN)].reverse();
    const last=D.weeks[selW], prev=D.weeks[selW+1]||last;
    const G=D.gerencia_goals||{};
    const mRetail=G.margen_contado_meta||0.085, mVol=G.margen_credito_meta||0.06;
    const dv=last.ppto>0?last.litros/last.ppto:0;
    const mcrRetail=last.margin_retail||0, mcVol=last.margin_volumen||0;
    const hasNM=last.margin_retail!==undefined&&last.margin_retail!==null;
    let h='<div class="kpi-grid">';
    h+=kpi('Venta Semana',fM(last.ventas),pD(last.ventas,prev.ventas),'c-accent',`$${fNum(last.precio_bruto||last.precio_neto||last.precio||0)}/L bruto`);
    h+=kpi('Litros',fK(last.litros),pD(last.litros,prev.litros),'c-blue',`Retail: ${fK(last.litros_retail||0)} · Vol: ${fK(last.litros_volumen||0)}`);
    h+=kpi('Nº Compras',fNum(last.facturas),pD(last.facturas,prev.facturas),'c-purple',`${last.facturas_contado||'—'} contado · ${last.facturas_credito||'—'} crédito`);
    h+=kpi('Nº Clientes',fNum(last.clientes),pD(last.clientes,prev.clientes),'c-teal','clientes únicos');
    h+=kpi('Litros vs Ppto',(dv*100).toFixed(0)+'%',null,dv>=.8?'c-green':dv>=.6?'c-amber':'c-red',`Meta: ${fK(last.ppto)} · Real: ${fK(last.litros)}`);
    if(hasNM){
        h+=kpi('Margen Retail',fP(mcrRetail),pD(mcrRetail,prev.margin_retail||0),mcrRetail>=mRetail?'c-green':mcrRetail>=mRetail*.9?'c-amber':'c-red',`meta ${fP(mRetail)}`);
        h+=kpi('Margen Volumen',fP(mcVol),pD(mcVol,prev.margin_volumen||0),mcVol>=mVol?'c-green':mcVol>=mVol*.9?'c-amber':'c-red',`meta ${fP(mVol)}`);
    } else {
        h+=kpi('Margen Bruto',fP(last.margin),pD(last.margin,prev.margin),last.margin>=.085?'c-green':'c-red','margin_zone ponderado');
    }
    h+=kpi('Recaudación',fM(last.recaud),pD(last.recaud,prev.recaud||1),'c-purple',`Transf: ${fM(last.transf||0)} · Cheq: ${fM(last.cheques||0)} · Fact: ${fM(last.factoring||0)}`);
    // ── KPI DSO mensual + Planta CxC ──
    // dso puede ser array legacy [{month,dso}] o nuevo {months:[...], cxc_hoy:N}
    const dsoRaw = D.dso || {};
    const dsoMonths = Array.isArray(dsoRaw) ? dsoRaw : (dsoRaw.months || []);
    const cxcHoy = Array.isArray(dsoRaw) ? null : (dsoRaw.cxc_hoy || null);
    let dsoHist = dsoMonths.map(d => ({label: d.label || d.month || d.mes, dso: d.dso != null ? d.dso : (d.dias || 0)}));
    if (!dsoHist.length) dsoHist = [{label: 'Mar 2026', dso: 25.8}];
    const dsoCur = dsoHist[dsoHist.length - 1];
    const dsoPrev = dsoHist.length > 1 ? dsoHist[dsoHist.length - 2] : null;
    const dsoDelta = (dsoPrev && dsoCur.dso != null && dsoPrev.dso != null) ? dsoCur.dso - dsoPrev.dso : null;
    const dsoCls = dsoCur.dso <= 25 ? 'c-green' : dsoCur.dso <= 35 ? 'c-amber' : 'c-red';
    const dsoSub = dsoPrev && dsoDelta != null
        ? `${dsoCur.label} · vs ${dsoPrev.label}: ${dsoDelta > 0 ? '+' : ''}${dsoDelta.toFixed(1)}d`
        : `${dsoCur.label} · promedio 3m / ventas × 30d`;
    h += kpi('DSO Mensual', dsoCur.dso.toFixed(1) + 'd', null, dsoCls, dsoSub);
    if (cxcHoy != null) {
        const cxcM = (cxcHoy / 1e6).toFixed(1) + 'M';
        h += kpi('Planta CxC', '$' + cxcM, null, 'c-purple', 'Impago hoy: CxC + cheques cartera');
    }
    h+='</div>';
    // Charts: Litros Retail vs Ppto, Litros Volumen vs Ppto
    h+='<div class="chart-row two">';
    h+='<div class="chart-card"><div class="chart-title">Litros Retail <span class="badge">vs Presupuesto</span></div><div class="chart-wrap"><canvas id="cRetail"></canvas></div></div>';
    h+='<div class="chart-card"><div class="chart-title">Litros Volumen <span class="badge">vs Presupuesto</span></div><div class="chart-wrap"><canvas id="cVolumen"></canvas></div></div>';
    h+='</div><div class="chart-row two">';
    h+='<div class="chart-card"><div class="chart-title">Recaudación vs Compras <span class="badge">CLP</span></div><div class="chart-wrap"><canvas id="cRecaud"></canvas></div></div>';
    h+='<div class="chart-card"><div class="chart-title">Venta diaria en litros <span class="badge">16 días hábiles</span></div><div class="chart-wrap"><canvas id="cDaily"></canvas></div></div>';
    h+='</div>';
    // ── Table: Resumen semanal ──
    h+='<div class="section-label">Resumen semanal</div>';
    h+='<div class="table-card" style="overflow-x:auto"><table><thead><tr>';
    h+='<th>Semana</th><th class="r">Ventas</th><th class="r">Litros</th><th class="r">Desv.</th><th class="r">Nº Comp.</th><th class="r">Nº Cli.</th>';
    if(hasNM){h+='<th class="r">M.Retail</th><th class="r">M.Volumen</th>';}else{h+='<th class="r">Margen</th>';}
    h+='<th class="r">$/L</th><th class="r">Recaud.</th><th class="r">Compras</th>';
    h+='</tr></thead><tbody>';
    D.weeks.slice(0,fN).forEach((w,i)=>{
        const dv2=w.ppto>0?w.litros/w.ppto:0;
        const sel=i===selW;
        h+=`<tr style="${sel?'background:var(--accent-light)':''}"><td class="${sel?'hi':''}">${w.label}${w.parcial?' *':''}</td>`;
        h+=`<td class="r">${fM(w.ventas)}</td>`;
        h+=`<td class="r">${fK(w.litros)}</td>`;
        h+=`<td class="r ${dv2>=.8?'ok':'bad'}">${(dv2*100).toFixed(0)}%</td>`;
        h+=`<td class="r">${w.facturas||'—'}</td>`;
        h+=`<td class="r">${w.clientes||'—'}</td>`;
        if(hasNM){
            const wRetail=w.margin_retail||0, wVol=w.margin_volumen||0;
            h+=`<td class="r ${wRetail>=mRetail?'ok':wRetail>=mRetail*.9?'':'bad'}">${fP(wRetail)}</td>`;
            h+=`<td class="r ${wVol>=mVol?'ok':wVol>=mVol*.9?'':'bad'}">${fP(wVol)}</td>`;
        } else {
            h+=`<td class="r ${w.margin>=.085?'ok':''}">${fP(w.margin)}</td>`;
        }
        h+=`<td class="r">$${fNum(w.precio_bruto||w.precio_neto||w.precio||0)}</td>`;
        h+=`<td class="r">${fM(w.recaud)}</td>`;
        h+=`<td class="r">${fM(w.compras_odoo||w.compras_enap||0)}</td>`;
        h+=`</tr>`;
    });
    h+='</tbody></table><div class="note">* Parcial · Margen = margin_zone (Odoo) · NC descontadas · Semana comercial Jue→Mié</div></div>';
    el.innerHTML=h;
    // ── Charts ──
    const labels=wk.map(w=>w.label.split('-')[0]);
    const gC='rgba(0,0,0,.04)', tC='#9c9b96';
    // Litros Retail vs Presupuesto
    dc('cRet');charts.cRet=new Chart(document.getElementById('cRetail'),{type:'bar',
        data:{labels,datasets:[
            {label:'Litros Retail',data:wk.map(w=>w.litros_retail||0),backgroundColor:wk.map(w=>(w.litros_retail||0)>=(w.ppto_retail||0)?C.green+'77':C.accent+'55'),borderRadius:5},
            {label:'Presupuesto',data:wk.map(w=>w.ppto_retail||0),type:'line',borderColor:C.amber,backgroundColor:'transparent',pointRadius:0,borderWidth:2,borderDash:[5,3],tension:0}
        ]},options:co(tC,gC,v=>fK(v))});
    // Litros Volumen vs Presupuesto
    dc('cVol');charts.cVol=new Chart(document.getElementById('cVolumen'),{type:'bar',
        data:{labels,datasets:[
            {label:'Litros Volumen',data:wk.map(w=>w.litros_volumen||0),backgroundColor:wk.map(w=>(w.litros_volumen||0)>=(w.ppto_volumen||0)?C.green+'77':C.blue+'55'),borderRadius:5},
            {label:'Presupuesto',data:wk.map(w=>w.ppto_volumen||0),type:'line',borderColor:C.amber,backgroundColor:'transparent',pointRadius:0,borderWidth:2,borderDash:[5,3],tension:0}
        ]},options:co(tC,gC,v=>fK(v))});

            {label:'Compras',data:wk.map(w=>Math.round((w.compras_odoo||w.compras_enap||0)/1e6)),type:'line',borderColor:C.red,backgroundColor:'transparent',pointRadius:2,pointBackgroundColor:C.red,borderWidth:2,tension:.3}
        ]},options:co(tC,gC,v=>'$'+v+'M')});
    // Daily chart with budget line (weekly ppto / 5 days)

            data:{labels:dLabels,datasets:[
                {label:'Litros',data:dRev.map(d=>d.litros),
                    backgroundColor:dRev.map(d=>d.litros>=dailyBudget?C.green+'66':d.day==='Lun'?C.blue+'88':C.accent+'44'),
                    borderRadius:5},
                {label:'Presupuesto diario',data:dRev.map(()=>dailyBudget),type:'line',borderColor:C.amber,backgroundColor:'transparent',pointRadius:0,borderWidth:2,borderDash:[5,3],tension:0}
            ]},
            options:co(tC,gC,v=>fK(v))});
    }
}
// ── GERENCIA ──
function renderGerencia(){
    const el=document.getElementById('p-gerencia');
    const G=D.gerencia_goals||{};
    const mMeta=G.margen_contado_meta||0.085, crMeta=G.margen_credito_meta||0.06;
    const slaTgt=G.sla_target||95;
    const w=D.weeks[selW];
    let h='';
    // ═══ SECTION 1: MÁRGENES — solo semana seleccionada ═══
    h+='<div class="section-label">Márgenes — '+w.label+(w.parcial?' (parcial)':'')+'</div>';
    const wRetail=w.margin_retail||0, wVol=w.margin_volumen||0, wm=w.margin||0;
    const fc=(w.facturas_contado||0)+(w.facturas_credito||0);
    h+='<div class="kpi-grid">';
    h+=kpi('Margen Retail',fP(wRetail),null,wRetail>=mMeta?'c-green':wRetail>=mMeta*.9?'c-amber':'c-red',`meta ${fP(mMeta)} · ${fc||w.facturas||0} facturas`);
    h+=kpi('Margen Volumen',fP(wVol),null,wVol>=crMeta?'c-green':wVol>=crMeta*.9?'c-amber':'c-red',`meta ${fP(crMeta)}`);
    h+=kpi('Margen Promedio',fP(wm),null,'c-blue','ponderado por monto');
    h+='</div>';
    // Per-term detail
    const bt=w.margin_by_term||{};
    const terms=Object.keys(bt);
    if(terms.length>0){
        h+='<div class="table-card"><table><thead><tr><th>Plazo de Pago</th><th class="r">Margen</th><th class="r">#Facturas</th><th class="r">Normalizado</th></tr></thead><tbody>';
        terms.sort((a,b)=>(bt[a].days||0)-(bt[b].days||0)).forEach(t=>{
            const d=bt[t];
            h+=`<tr><td class="hi">${t}</td><td class="r">${fP(d.margin)}</td><td class="r">${d.count}</td><td class="r">${fP(d.normalizado)}</td></tr>`;
        });
        h+='</tbody></table><div class="note">Normalizado = margen + (30 − días) / 30 pp</div></div>';
    }
        // ═══ SECTION 2: CHURN — definiciones correctas TomEnergy ═══
    const churn=D.churn||{};
    h+='<div class="section-label">Churn & Retención</div>';
    if(churn.lost_count!==undefined){
        // ── KPIs principales ──
        const chPct=churn.churn_pct||0;
        h+='<div class="kpi-grid">';
        h+=kpi('Churn % este mes',''+chPct+'%',null,chPct<=4?'c-green':chPct<=7?'c-amber':'c-red',`${churn.newly_lost_this_month||0} clientes cruzaron 270d sin factura`);
        h+=kpi('Perdidos acumulados',''+churn.lost_count,null,churn.lost_count<400?'c-amber':'c-red','Sin factura 9+ meses');
        h+=kpi('Durmientes activos',''+churn.dormant_count,null,churn.dormant_count<=80?'c-green':churn.dormant_count<=130?'c-amber':'c-red','Superaron umbral de frecuencia');
        h+='</div>';
        // ── Historial mensual churn % ──
        const hist=churn.history||[];
        if(hist.length>0){
            h+='<div class="table-card"><table><thead><tr><th>Mes</th><th class="r">Nuevos Perdidos</th><th class="r">Activos inicio</th><th class="r">Churn %</th></tr></thead><tbody>';
            hist.forEach(m=>{
                const cls=m.pct<=4?'good':m.pct<=7?'warn':'bad';
                h+=`<tr><td class="hi">${m.month}</td><td class="r">${m.new_lost||0}</td><td class="r">${m.active_start||0}</td><td class="r ${cls}">${m.pct}%</td></tr>`;
            });
            h+='</tbody></table></div>';
        }
        // ── Durmientes (responsabilidad fidelización) ──
        const dormant=churn.dormant||[];
        if(dormant.length>0){
            h+='<div class="section-label" style="font-size:13px;margin-top:1.5rem">Durmientes — Fidelización (Comber Sigall)</div>';
            h+='<div class="table-card"><table><thead><tr><th>Cliente</th><th class="r">Últ. Factura</th><th class="r">Días sin compra</th><th class="r">Umbral</th><th class="r">Frec. promedio</th></tr></thead><tbody>';
            dormant.slice(0,20).forEach(c=>{
                h+=`<tr><td class="hi">${c.name}</td><td class="r">${c.last_invoice}</td><td class="r bad">${c.days_since}d</td><td class="r">${c.threshold||'—'}d</td><td class="r">${c.freq_days?c.freq_days+'d':'—'}</td></tr>`;
            });
            h+=`</tbody></table><div class="note">Durmiente = superó freq×1.5 (<30d) o freq×1.3 (≥30d) pero <270d sin factura. Responsable: Fidelización.</div></div>`;
        }
        // ── Perdidos (churn real) ──
        const lost=churn.lost||[];
        if(lost.length>0){
            h+='<div class="section-label" style="font-size:13px;margin-top:1.5rem">Perdidos — 270+ días sin factura</div>';
            h+='<div class="table-card"><table><thead><tr><th>Cliente</th><th class="r">Últ. Factura</th><th class="r">Días sin compra</th></tr></thead><tbody>';
            lost.slice(0,20).forEach(c=>{
                h+=`<tr><td class="hi">${c.name}</td><td class="r">${c.last_invoice}</td><td class="r bad">${c.days_since}d</td></tr>`;
            });
            h+=`</tbody></table><div class="note">Perdido = 270+ días sin factura. Si vuelve a comprar, cuenta como cliente nuevo. Responsable: ejecutivo comercial.</div></div>`;
        }
        if(churn.definition){
            h+=`<div class="note" style="margin-top:.5rem">${churn.definition}</div>`;
        }
    } else {
        h+='<div class="chart-card" style="text-align:center;padding:2rem;color:var(--text3)">Sin datos de churn</div>';
    }
        // ═══ SECTION 3: SLA OPERACIONES — semana actual + histórico ═══
    const sla=D.sla||[];
    if(sla.length>0){
        h+='<div class="section-label">SLA Entrega — '+sla[0].label+'</div>';
        const slaW=sla[0];
        const allTotal=Object.values(slaW.zones||{}).reduce((s,z)=>s+z.total,0);
        const allOT=Object.values(slaW.zones||{}).reduce((s,z)=>s+z.on_time,0);
        const allPct=allTotal>0?allOT/allTotal*100:100;
        const allLate=allTotal-allOT;
        h+='<div class="kpi-grid">';
        h+=kpi('SLA Global',allPct.toFixed(1)+'%',null,allPct>=slaTgt?'c-green':allPct>=90?'c-amber':'c-red',`${allOT} a tiempo / ${allTotal} total · meta ${slaTgt}%`);
        h+=kpi('Entregas Atrasadas',''+allLate,null,allLate===0?'c-green':allLate<=3?'c-amber':'c-red','fuera de plazo (>24h)');
        h+='</div>';
        // Historical SLA table (last 8 weeks)
        if(sla.length>1){
            h+='<div class="table-card"><table><thead><tr><th>Semana</th><th class="r">Total</th><th class="r">A Tiempo</th><th class="r">Atrasados</th><th class="r">SLA %</th></tr></thead><tbody>';
            sla.slice(0,8).forEach((w,idx)=>{
                const wT=Object.values(w.zones||{}).reduce((s,z)=>s+z.total,0);
                const wOT=Object.values(w.zones||{}).reduce((s,z)=>s+z.on_time,0);
                const wPct=wT>0?wOT/wT*100:100;
                const wLate=wT-wOT;
                const cls=wPct>=slaTgt?'ok':wPct>=90?'':'bad';
                const tag=idx===0?'<span style="font-size:9px;color:var(--accent);font-weight:700"> · actual</span>':'';
                h+=`<tr><td class="hi">${w.label}${tag}</td><td class="r">${wT}</td><td class="r">${wOT}</td><td class="r ${wLate>0?'bad':''}">${wLate}</td><td class="r ${cls}">${wPct.toFixed(1)}%</td></tr>`;
            });
            h+='</tbody></table><div class="note">Histórico últimas 8 semanas</div></div>';
        }
        // SLA by zone table (current week only)
        h+='<div class="section-label" style="font-size:13px;margin-top:1.5rem">Por Zona — '+slaW.label+'</div>';
        const zones=Object.keys(slaW.zones||{}).sort();
        h+='<div class="table-card"><table><thead><tr><th>Zona</th><th class="r">Total</th><th class="r">A Tiempo</th><th class="r">Atrasados</th><th class="r">SLA %</th></tr></thead><tbody>';
        zones.forEach(z=>{
            const zd=slaW.zones[z];
            const cls=zd.pct>=slaTgt?'ok':zd.pct>=90?'':'bad';
            h+=`<tr><td class="hi">${z}</td><td class="r">${zd.total}</td><td class="r">${zd.on_time}</td><td class="r ${zd.late>0?'bad':''}">${zd.late}</td><td class="r ${cls}">${zd.pct.toFixed(0)}%</td></tr>`;
        });
        h+='</tbody></table>';
        h+='<div class="note">SLA = entrega completada (date_done) dentro de 24h desde fecha programada (scheduled_date) · stock.picking outgoing</div></div>';
        // Late deliveries detail list
        let hasLate=false;
        zones.forEach(z=>{
            const zd=slaW.zones[z];
            if(zd.late_clients&&zd.late_clients.length>0) hasLate=true;
        });
        if(hasLate){
            h+='<div class="section-label">Entregas Atrasadas — Detalle</div>';
            h+='<div class="table-card"><table><thead><tr><th>Cliente</th><th>Zona</th></tr></thead><tbody>';
            zones.forEach(z=>{
                const zd=slaW.zones[z];
                (zd.late_clients||[]).forEach(c=>{
                    h+=`<tr><td class="hi">${c}</td><td>${z}</td></tr>`;
                });
            });
            h+='</tbody></table></div>';
        }
    }
    // ═══ SECTION 4: CUMPLIMIENTO PROVEEDORES (ENAP + ADQUIM) ═══
    const enap=D.enap;
    if(enap&&enap.total_target>0){
        h+='<div class="section-label">Cumplimiento Proveedores — '+enap.month+' (día '+enap.days_elapsed+'/'+enap.days_in_month+')</div>';
        const pctExpected=Math.round(enap.days_elapsed/enap.days_in_month*100);
        // Global KPIs
        h+='<div class="kpi-grid">';
        h+=kpi('Total MTD',fK(enap.total_mtd),null,enap.total_compliance_pct>=pctExpected?'c-green':enap.total_compliance_pct>=pctExpected*.8?'c-amber':'c-red',`${enap.total_compliance_pct}% de ${fK(enap.total_target)}`);
        h+=kpi('Proyectado',fK(enap.total_projected),null,enap.total_projected_pct>=95?'c-green':enap.total_projected_pct>=80?'c-amber':'c-red',`${enap.total_projected_pct}% de meta`);
        h+='</div>';
        // Per-supplier detail
        const suppliers=enap.suppliers||{};
        h+='<div class="table-card"><table><thead><tr><th>Proveedor</th><th class="r">Meta Mes</th><th class="r">MTD Real</th><th class="r">Cumpl. %</th><th class="r">Proyectado</th><th class="r">Proy. %</th></tr></thead><tbody>';
        for(const[name,s] of Object.entries(suppliers)){
            const lbl=name==='enap'?'ENAP':'ADQUIM + ADGREEN';
            const cc=s.compliance_pct>=pctExpected?'ok':s.compliance_pct>=pctExpected*.8?'':'bad';
            const pc=s.projected_pct>=95?'ok':s.projected_pct>=80?'':'bad';
            h+=`<tr><td class="hi">${lbl}</td><td class="r">${fK(s.target_total)}</td><td class="r">${fK(s.mtd_litros)}</td><td class="r ${cc}">${s.compliance_pct}%</td><td class="r">${fK(s.projected)}</td><td class="r ${pc}">${s.projected_pct}%</td></tr>`;
            // Plant breakdown
            const plants=s.plants||{};
            for(const[plant,pd] of Object.entries(plants)){
                if(pd.target>0) h+=`<tr style="font-size:10px;color:var(--text3)"><td style="padding-left:24px">${plant}</td><td class="r">${fK(pd.target)}</td><td colspan="4"></td></tr>`;
            }
        }
        // Total row
        h+=`<tr style="font-weight:700;border-top:2px solid var(--border)"><td>TOTAL</td><td class="r">${fK(enap.total_target)}</td><td class="r">${fK(enap.total_mtd)}</td><td class="r">${enap.total_compliance_pct}%</td><td class="r">${fK(enap.total_projected)}</td><td class="r">${enap.total_projected_pct}%</td></tr>`;
        h+='</tbody></table>';
        // Progress bar
        const pctBar=Math.min(enap.total_compliance_pct,100);
        h+=`<div style="margin-top:12px"><div style="position:relative;height:24px;background:var(--surface2);border-radius:12px;overflow:hidden">`;
        h+=`<div style="height:100%;width:${pctBar}%;background:${enap.total_compliance_pct>=pctExpected?C.green:C.red};border-radius:12px"></div>`;
        h+=`<div style="position:absolute;left:${pctExpected}%;top:0;bottom:0;width:2px;background:${C.amber}" title="Esperado ${pctExpected}%"></div>`;
        h+=`</div><div style="display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--text3)"><span>Real: ${enap.total_compliance_pct}%</span><span style="color:${C.amber}">Esperado: ${pctExpected}%</span><span>Proyectado: ${enap.total_projected_pct}%</span></div></div>`;
        h+='</div>';
    } else if(enap){
        h+='<div class="section-label">Cumplimiento Proveedores</div>';
        h+='<div class="chart-card" style="text-align:center;padding:2rem;color:var(--text3)">Sin metas configuradas para '+(enap.month||'este mes')+'</div>';
    }
    el.innerHTML=h;
}
// ── RESUMEN EJECUTIVO — Estilo Reporte Lunes ──
function renderResumen(){
    const el=document.getElementById('p-resumen');
    const wk=D.weeks.slice(0,fN);
    if(!wk.length){el.innerHTML='<p>Sin datos</p>';return;}
    const fm2=n=>!n&&n!==0?'':Math.round(n).toLocaleString('es-CL');
    const fp2=n=>!n&&n!==0?'':(n*100).toFixed(2)+'%';
    const fpI=n=>!n&&n!==0?'':(n*100).toFixed(0)+'%';
    const rows=[
        {section:'Ventas'},
        {label:'en $', key:'ventas', fmt:'money'},
        {label:'Litros vendido', key:'litros', fmt:'num'},
        {label:'Litros presupuesto', key:'ppto', fmt:'num'},
        {label:'Número de Compras', key:'facturas', fmt:'num'},
        {label:'Número de Clientes Vendidos', key:'clientes', fmt:'num'},
        {label:'Desviación ppto', fn:function(w){return w.ppto>0?w.litros/w.ppto:0}, fmt:'pctInt',
            color:function(v){if(v>=1)return'#0f6e56';if(v>=0.8)return'#854f0b';return'#a32d2d'},
            bg:function(v){if(v>=1)return'#dcf5e7';if(v>=0.8)return'#fef3cd';if(v>=0.6)return'#fce5d8';return'#fde2e2'}},
        {label:'Margen bruto', fn:function(w){return w.margin||0}, fmt:'pct'},
        {sep:true},
        {label:'Precio venta promedio', fn:function(w){return w.precio_bruto||w.precio_neto||0}, fmt:'num'},
        {sep:true},
        {label:'Recaudacion Total (Transferencias + Cheques dep + Factoring)', key:'recaud', fmt:'money', bold:true},
        {label:'Transferencia/depositos Chile', key:'transf', fmt:'money', italic:true},
        {label:'Cheques depositados', key:'cheques', fmt:'money', italic:true},
        {label:'factoring', key:'factoring', fmt:'money', italic:true},
        {sep:true},
        {section:'Cheques totales en Cartera'},
        {label:'Cheques recibidos durante la semana', key:'cheq_recibidos', fmt:'money'},
        {label:'Saldo cartera cheques', key:'cheq_cartera_saldo', fmt:'money'},
        {sep:true},
        {label:'Compras Odoo', key:'compras_odoo', fmt:'money', bold:true},
    ];
    var colW=wk.length<=4?'130px':wk.length<=8?'110px':'95px';
    var h='<div class="chart-card" style="padding:1.5rem">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">';
    h+='<h2 style="font-size:16px;font-weight:600">Resumen Semanal</h2>';
    h+='<button class="btn" style="font-size:12px;padding:6px 14px" onclick="copyResumenTable()">Copiar tabla</button>';
    h+='</div>';
    h+='<div style="overflow-x:auto">';
    h+='<table id="resumenTable" style="width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap">';
    h+='<thead><tr>';
    h+='<th style="text-align:left;padding:8px 12px;border-bottom:2px solid var(--border);font-size:11px;color:var(--text2);min-width:220px;position:sticky;left:0;background:var(--surface);z-index:1">semana</th>';
    wk.forEach(function(w,i){
        var isSel=i===selW;
        h+='<th style="text-align:right;padding:8px 6px;border-bottom:2px solid var(--border);font-size:11px;color:'+(isSel?'var(--accent)':'var(--text2)')+';font-weight:'+(isSel?700:500)+';min-width:'+colW+';'+(isSel?'background:var(--accent-light)':'')+'">'+w.label+(w.parcial?' *':'')+'</th>';
    });
    h+='<th style="text-align:right;padding:8px 6px;border-bottom:2px solid var(--border);font-size:11px;color:var(--text2);font-weight:700;min-width:100px;border-left:2px solid var(--border)">Promedio</th>';
    h+='</tr></thead><tbody>';
    rows.forEach(function(r){
        if(r.sep){h+='<tr><td colspan="'+(wk.length+2)+'" style="height:8px;border:none"></td></tr>';return;}
        if(r.section){h+='<tr><td colspan="'+(wk.length+2)+'" style="padding:6px 12px;font-weight:700;font-size:12px;color:var(--text);border-bottom:1px solid var(--border);background:var(--surface2)">'+r.section+'</td></tr>';return;}
        h+='<tr>';
        h+='<td style="padding:5px 12px;border-bottom:1px solid #f0f0ee;color:var(--text'+(r.bold?'':'2')+');font-weight:'+(r.bold?600:400)+';'+(r.italic?'font-style:italic;':'')+'position:sticky;left:0;background:var(--surface);z-index:1">'+r.label+'</td>';
        var vals=wk.map(function(w){if(r.fn)return r.fn(w);if(r.key)return w[r.key]||0;return 0});
        vals.forEach(function(v,i){
            var isSel=i===selW;
            var display='';
            if(r.fmt==='money')display=v?fm2(v):'';
            else if(r.fmt==='num')display=v?fm2(v):'';
            else if(r.fmt==='pct')display=v?fp2(v):'';
            else if(r.fmt==='pctInt')display=v?fpI(v):'';
            var cellBg=isSel?'var(--accent-light)':'';
            var cellColor='var(--text)';
            if(r.color)cellColor=r.color(v);
            if(r.bg)cellBg=r.bg(v);
            h+='<td style="text-align:right;padding:5px 6px;border-bottom:1px solid #f0f0ee;font-variant-numeric:tabular-nums;'+(cellBg?'background:'+cellBg+';':'')+'color:'+cellColor+';font-weight:'+(r.bold?600:400)+'">'+display+'</td>';
        });
        var validVals=vals.filter(function(v){return v!=null&&v!==0});
        var avgVal=validVals.length?validVals.reduce(function(a,b){return a+b},0)/validVals.length:0;
        var avgDisplay='';
        if(r.fmt==='money')avgDisplay=avgVal?fm2(Math.round(avgVal)):'';
        else if(r.fmt==='num')avgDisplay=avgVal?fm2(Math.round(avgVal)):'';
        else if(r.fmt==='pct')avgDisplay=avgVal?fp2(avgVal):'';
        else if(r.fmt==='pctInt')avgDisplay=avgVal?fpI(avgVal):'';
        h+='<td style="text-align:right;padding:5px 6px;border-bottom:1px solid #f0f0ee;border-left:2px solid var(--border);font-weight:600;font-variant-numeric:tabular-nums">'+avgDisplay+'</td>';
        h+='</tr>';
    });
    h+='</tbody></table></div>';
    h+='<div style="margin-top:8px;font-size:11px;color:var(--text3)">* Parcial · Semana comercial Jue→Mié · Ventas con IVA+IEC · Solo diesel B1</div>';
    h+='</div>';
    // ── Text summary below ──
    var last=wk[selW];
    var dv=last.ppto>0?last.litros/last.ppto:0;
    var prevW=wk[selW+1];
    var prevChg=prevW&&prevW.litros>0?((last.litros-prevW.litros)/prevW.litros*100).toFixed(0):'--';

function copyResumenTable(){
    var table=document.getElementById('resumenTable');
    if(!table)return;
    var tsv='';
    var rows=table.querySelectorAll('tr');
    rows.forEach(function(row){
        var cells=row.querySelectorAll('th,td');
        var vals=[];
        cells.forEach(function(c){vals.push(c.textContent.trim())});
        if(vals.some(function(v){return v}))tsv+=vals.join('\t')+'\n';
    });
    navigator.clipboard.writeText(tsv).then(function(){
        var btn=event.target;
        btn.textContent='Copiado!';
        setTimeout(function(){btn.textContent='Copiar tabla'},2000);
    });
}

function scoreBadge(score, level){
    const cls=level==='Crítico'?'s-critico':level==='Alto'?'s-alto':level==='Medio'?'s-medio':'s-bajo';
    return `<span class="sbadge ${cls}">${score}</span>`;
}
function riskLevel(score){
    if(score>=60) return 'Crítico';
    if(score>=40) return 'Alto';
    if(score>=20) return 'Medio';
    return 'Bajo';
}
function renderRiesgo(){
    const el=document.getElementById('p-riesgo');
    const hasCrm=D._crm&&D._crm.credit_risk;
    const cr=hasCrm?D._crm.credit_risk:{}, sm=cr.summary||{};
    const scoreData=cr.score_table||[], lineaData=cr.linea_insuficiente||[];
    const fMon=n=>n?'$'+Math.round(n).toLocaleString('es-CL'):'$0';
    const fL=n=>n?Math.round(n).toLocaleString('es-CL')+' L':'0 L';
    const total=sm.total_evaluados||1;
    const pctCrit=((sm.criticos||0)/total*100).toFixed(1);
    const pctAlto=((sm.altos||0)/total*100).toFixed(1);

    let h='<div class="kpi-grid">';
    h+=kpi('% Crítico+Alto',pctCritAlto+'%',null,parseFloat(pctCritAlto)>30?'c-red':parseFloat(pctCritAlto)>15?'c-amber':'c-green',(sm.criticos||0)+' críticos + '+(sm.altos||0)+' altos');
    h+=kpi('Líneas Insuficientes',sm.linea_insuficiente_count||0,null,'c-purple','requieren aumento');
    h+=kpi('Monto Vencido',fMon(sm.total_overdue_amount),null,'c-red',(sm.total_siniestros||0)+' siniestros');
    h+=kpi('Utiliz. Promedio',(sm.avg_utilizacion||0)+'%',null,'c-amber',(sm.total_evaluados||0)+' evaluados');
    h+=kpi('Riesgo Bajo',sm.bajos||0,null,'c-green','clientes sanos');
    h+='</div>';
    // Charts row
    h+='<div class="chart-row two">';
    h+='<div class="chart-card"><div class="chart-title">Distribución de Riesgo <span class="badge">'+total+' clientes</span></div><div class="chart-wrap"><canvas id="cRiskDist"></canvas></div></div>';
    h+='<div class="chart-card"><div class="chart-title">Riesgo Vigente AVLA <span class="badge">% monto no cubierto</span></div><div class="chart-wrap"><canvas id="cRiesgoVigente"></canvas></div></div>';
    h+='</div>';
    // ── Tabla unificada: score_table + linea_insuficiente merged, ordenada por score desc ──
    // Columnas: Score | Cliente | Condición | Línea | Saldo | Utiliz. | Proy. L/mes | % Línea
    // Flag "⚠️ Línea" si el cliente aparece en linea_insuficiente
    const lineaInsufIds = new Set(lineaData.map(c => c.name));
    // Enriquecer score_table con projected_monthly/linea_ratio desde lineaData
    const lineaMap = {};
    lineaData.forEach(c => { lineaMap[c.name] = c; });
    const unifiedTable = [...scoreData].sort((a,b) => b.risk_score - a.risk_score);
    h += '<div class="section-label">Clientes con Línea de Crédito — Score & Línea (' + unifiedTable.length + ')</div>';
    h += '<div class="table-scroll" style="max-height:520px"><table><thead><tr>';
    h += '<th>Score</th><th>Cliente</th><th>Condición pactada</th>';
    h += '<th class="r">Línea</th><th class="r">Saldo</th><th class="r">Utiliz.</th>';
    h += '<th class="r">Proy. L/mes</th><th class="r">% Línea</th>';
    h += '</tr></thead><tbody>';
    unifiedTable.forEach(c => {
        const lv = riskLevel(c.risk_score);
        const uc = c.utilizacion_pct >= 90 ? 'bad' : c.utilizacion_pct >= 70 ? '' : 'ok';
        const insuf = lineaInsufIds.has(c.name);
        const li = lineaMap[c.name] || {};
        const proyL = c.avg_monthly_litros ? Math.round(c.avg_monthly_litros).toLocaleString('es-CL') + ' L' : '—';
        const lineaRatio = li.linea_ratio || c.linea_ratio;
        const lineaRatioHtml = lineaRatio ? `<span class="${lineaRatio >= 100 ? 'bad' : ''}">${lineaRatio}%</span>` : '—';
        const insufFlag = insuf ? ' <span style="font-size:10px;background:#fef3c7;color:#92400e;padding:1px 5px;border-radius:4px;font-weight:700">⚠️ línea</span>' : '';
        // Condición pactada: plazo de pago + tipo venta
        const tipo = c.tipo_venta || (c.is_volume_client ? 'Volumen' : 'Crédito');
        const cond = c.plazo_pago_dias ? `${tipo} ${c.plazo_pago_dias}d` : tipo;
        const dicomFlag = c.has_dicom ? ' <span style="font-size:10px;background:#fce7f3;color:#9d174d;padding:1px 5px;border-radius:4px;font-weight:700">DICOM</span>' : '';
        h += `<tr>
            <td>${scoreBadge(c.risk_score, lv)}</td>
            <td class="hi">${c.name}${insufFlag}${dicomFlag}</td>
            <td style="font-size:12px;white-space:nowrap">${cond}</td>
            <td class="r">${fMon(c.monto_credito)}</td>
            <td class="r">${fMon(c.saldo_credito)}</td>
            <td class="r ${uc}">${c.utilizacion_pct}%</td>
            <td class="r">${proyL}</td>
            <td class="r">${lineaRatioHtml}</td>
        </tr>`;
    });
    h += '</tbody></table></div>';
    // ═══ ALGORITMO DE PRICING — Documentación + Tabla agrupada por margen ═══
    // ── Parse bomba from pricelist string ──
    function parseBomba(plist){
        if(!plist||plist==='—') return null;
        const m=plist.match(/BOMBA\s*([+-]?\d+)/i);
        return m?parseInt(m[1]):null;
    }
    // ── Calculadora excepción (replica hoja Mantenedor con fórmula exacta) ──
    // Valores pre-calculados (Mantenedor!I/K/M) por zona y tipo de venta. Actualizar cuando ENAP cambie.
    // Fórmula real: D17 = VLOOKUP(zona, base_min, col_tipo) + (-días_real + 30) × C10/30
    //   donde C10 = -16 (costo financiero base por 30 días)
    //   col_tipo: 5=Crédito (CredMin 7%), 7=Volumen (VolMin 8%), 9=Contado (ContMin 4.5%)
    const ZONAS_PRECIOS={
        // bomba: precio bomba referencia · cred/vol/cont: mínimos pre-calculados
        'Rancagua':            {bomba:1561, cred:1504, vol:1465, cont:1488},
        'San Fernando':        {bomba:1551, cred:1504, vol:1465, cont:1488},
        'San Fdo':             {bomba:1551, cred:1504, vol:1465, cont:1488},
        'VI Costa':            {bomba:1526, cred:1504, vol:1465, cont:1488},
        'Talca':               {bomba:1503, cred:1494, vol:1454, cont:1478},
        'Curico':              {bomba:1503, cred:1494, vol:1454, cont:1478},
        'Curicó':              {bomba:1503, cred:1494, vol:1454, cont:1478},
        'Chillan':             {bomba:1503, cred:1494, vol:1454, cont:1478},
        'Chillán':             {bomba:1503, cred:1494, vol:1454, cont:1478},
        'Región Metropolitana':{bomba:1561, cred:1504, vol:1465, cont:1488},
    };
    const COSTO_FIN_30=-16;  // $/L NEGATIVO: cada día más allá de 30 sube el costo
    function calcExcepcion(zona,tipo,dias){
        const z=ZONAS_PRECIOS[zona];
        if(!z) return null;
        const colKey=tipo==='Crédito'?'cred':tipo==='Volumen'?'vol':tipo==='Contado'?'cont':null;
        if(!colKey) return null;
        const base=z[colKey];
        // Replica exacta: minimo = base + (-dias + 30) × C10 / 30
        const minimo=base+(-dias+30)*COSTO_FIN_30/30;
        const excepcion=Math.round(minimo-10);
        const bombaDiff=Math.round(excepcion-z.bomba);
        return {excepcion, bombaZona:z.bomba, bombaDiff};
    }
    // ── Inferir tipo_venta desde días reales (criterio Pauline 8-may-2026) ──
    //   is_volume_client=true → Volumen (flag explícita gana)
    //   avg_payment_days ≤ 7 → Contado
    //   avg_payment_days 8-60 → Crédito
    function inferTipoVenta(c){
        if(c.is_volume_client||c.tipo_venta==='Volumen') return 'Volumen';
        const d=c.avg_payment_days;
        if(d==null) return 'Crédito';  // fallback seguro
        return d<=7?'Contado':'Crédito';
    }
    // ── Margin bands definition ──
    const BANDS=[
        {label:'Margen < 4%',  id:'lt4',  min:-999, max:4,   targetBomba:'+40 a +60', color:'#a32d2d', bg:'#fcebeb'},
        {label:'Margen 4–6%',  id:'4to6', min:4,    max:6,   targetBomba:'+25 a +40', color:'#854f0b', bg:'#faeeda'},
        {label:'Margen 6–8%',  id:'6to8', min:6,    max:8,   targetBomba:'+10 a +25', color:'#1a5fb4', bg:'#e8f0fc'},
        {label:'Margen 8–10%', id:'8to10',min:8,    max:10,  targetBomba:'+0 a +10',  color:'#0f6e56', bg:'#e1f5ee'},
        {label:'Margen ≥ 10%', id:'gt10', min:10,   max:999, targetBomba:'−50 a +0',  color:'#0f6e56', bg:'#e1f5ee'},
    ];
    function getBand(margin){return BANDS.find(b=>margin>=b.min&&margin<b.max)||BANDS[0]}
    // ── Two-component adjustment ──
    function calcAdjuste(c){
        const diff=Math.round((c.avg_payment_days||0)-(c.plazo_pago_dias||30));
        // Component 1: Morosidad (costo financiero del atraso)
        let adjMora=0;
        if(diff>60) adjMora=30;
        else if(diff>30) adjMora=20;
        else if(diff>15) adjMora=15;
        else if(diff>7) adjMora=10;
        else if(diff>0) adjMora=5;
        // Component 2: Margen insuficiente (el precio actual no cubre el riesgo)
        const mg=c.avg_margin_pct||0;
        let adjMargen=0;
        if(mg>0 && mg<2) adjMargen=18;
        else if(mg>=2 && mg<4) adjMargen=12;
        else if(mg>=4 && mg<6) adjMargen=7;
        else if(mg>=6 && mg<8) adjMargen=3;
        // Component 3: Agravantes
        let adjFlag=0;
        if(c.has_dicom) adjFlag+=10;
        if(c.siniestro_count>0) adjFlag+=15;
        const adjTotal=adjMora+adjMargen+adjFlag;
        const bombaActual=parseBomba(c.pricelist);
        const bombaNueva=bombaActual!=null?bombaActual+adjTotal:null;
        return {diff, adjMora, adjMargen, adjFlag, adjTotal, bombaActual, bombaNueva};
    }
    // ── Build enriched data ──
    const withAdj=scoreData.map(c=>{
        const s=calcAdjuste(c);
        const band=getBand(c.avg_margin_pct||0);
        return {...c, _diff:s.diff, _adjMora:s.adjMora, _adjMargen:s.adjMargen, _adjFlag:s.adjFlag, _adj:s.adjTotal, _bombaAct:s.bombaActual, _bombaNueva:s.bombaNueva, _band:band};
    });
    const needAdj=withAdj.filter(c=>c._adj>0);

    // ── Algorithm documentation box ──
    h+='<div class="section-label">Política de Ajuste de Precios — Algoritmo</div>';
    h+='<div class="chart-card" style="font-size:12px;line-height:1.8;color:var(--text2)">';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">';
    // Col 1: Componentes
    h+='<div>';
    h+='<div style="font-weight:700;color:var(--text);margin-bottom:8px;font-size:13px">Componentes del Ajuste</div>';
    h+='<div style="margin-bottom:12px"><strong style="color:var(--accent)">1. Morosidad</strong> (costo financiero del atraso)<br>';
    h+='Atraso 1-7d → +5 · 8-15d → +10 · 16-30d → +15 · 31-60d → +20 · >60d → +30</div>';
    h+='<div style="margin-bottom:12px"><strong style="color:var(--accent)">2. Margen insuficiente</strong> (precio no cubre riesgo)<br>';
    h+='Margen &lt;2% → +18 · 2-4% → +12 · 4-6% → +7 · 6-8% → +3 · ≥8% → 0</div>';
    h+='<div><strong style="color:var(--accent)">3. Agravantes</strong><br>';
    h+='DICOM → +10 · Siniestro AVLA → +15</div>';
    h+='</div>';
    // Col 2: Bandas de margen
    h+='<div>';
    h+='<div style="font-weight:700;color:var(--text);margin-bottom:8px;font-size:13px">Bandas de Margen — Bomba Esperada</div>';
    BANDS.forEach(b=>{
        h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${b.color}"></span><strong>${b.label}</strong> → Bomba ${b.targetBomba}</div>`;
    });
    h+='<div style="margin-top:12px;font-size:11px;color:var(--text3)">Clientes en la misma banda de margen deberían tener bombas similares. Outliers abajo de su banda requieren ajuste.</div>';
    h+='</div>';
    h+='</div>';
    h+='<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)"><strong>Fórmula:</strong> Bomba sugerida = Bomba actual + Ajuste morosidad + Ajuste margen + Agravantes. Ejemplo: cliente en B+7 con 10d atraso y 5% margen → B+7 + 10 (mora) + 7 (margen) = <strong>B+24</strong></div>';
    h+='</div>';

    // ── Table grouped by margin bands ──
    h+='<div class="section-label">Clientes por Banda de Margen ('+needAdj.length+' de '+scoreData.length+' requieren ajuste)</div>';
    BANDS.forEach(band=>{
        const clients=withAdj.filter(c=>c._band.id===band.id).sort((a,b)=>(b.avg_monthly_litros||0)-(a.avg_monthly_litros||0));
        if(clients.length===0) return;
        const avgBomba=clients.filter(c=>c._bombaAct!=null);
        const avgB=avgBomba.length?Math.round(avgBomba.reduce((s,c)=>s+c._bombaAct,0)/avgBomba.length):null;
        const needCount=clients.filter(c=>c._adj>0).length;
        h+=`<div style="background:${band.bg};color:${band.color};font-weight:700;font-size:12px;padding:8px 12px;margin-top:1.5rem;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center">`;
        h+=`<span>${band.label} — ${clients.length} clientes</span>`;
        h+=`<span style="font-weight:500;font-size:11px">Bomba esperada: ${band.targetBomba}${avgB!=null?' · Promedio actual: B'+(avgB>=0?'+':'')+avgB:''} · ${needCount} requieren ajuste</span>`;
        h+='</div>';
        h+='<div class="table-scroll" style="max-height:350px;border-radius:0 0 8px 8px;margin-bottom:0"><table><thead><tr><th>Cliente</th><th>Zona</th><th>Ejecutivo</th><th>Score</th><th>Actual</th><th style="text-align:center">Excep. mín</th><th class="r">Plazo</th><th class="r">Paga en</th><th class="r">Atraso</th><th class="r">+Mora</th><th class="r">+Margen</th><th class="r">+Flag</th><th class="r">L/mes</th><th style="text-align:center">Sugerencia</th></tr></thead><tbody>';
        clients.forEach(c=>{
            const lv=c.risk_level||riskLevel(c.risk_score);
            const diffCls=c._diff>15?'bad':c._diff>0?'':'ok';
            const actLabel=c._bombaAct!=null?'B'+(c._bombaAct>=0?'+':'')+c._bombaAct:(c.pricelist||'—');
            // ── Cálculo excepción ──
            const zonaCli=c.zona||'—';
            const tipoCli=inferTipoVenta(c);
            // Días reales: usar avg_payment_days exactamente (incluso si es 0). Solo fallback si null/undefined.
            const diasReal=(c.avg_payment_days!=null)?c.avg_payment_days:(c.plazo_pago_dias||30);
            const calc=calcExcepcion(zonaCli,tipoCli,diasReal);
            let excepHtml='<span style="color:var(--text3);font-size:11px">—</span>';
            if(calc){
                // Semáforo: bombaActual vs bombaDiff de excepción
                // OK si bomba_cliente > excepcion_diff por ≥10
                // Cerca límite si diferencia entre -10 y +10
                // Bajo mínimo si bomba_cliente ≤ excepcion_diff
                const bombaCli=c._bombaAct;
                const excepDiff=calc.bombaDiff;  // ej -29
                const excepLabel='B'+(excepDiff>=0?'+':'')+excepDiff;
                let dot='🟢',clr='var(--green)',bg='#e1f5ee';
                if(bombaCli!=null){
                    const margen=bombaCli-excepDiff;  // cuánto sobre excepción
                    if(margen<=0){dot='🔴';clr='#a32d2d';bg='#fcebeb';}
                    else if(margen<10){dot='🟡';clr='#854f0b';bg='#faeeda';}
                }
                excepHtml=`<span title="Zona ${zonaCli} · ${tipoCli} · ${diasReal}d → excep $${calc.excepcion}/L (bomba zona $${calc.bombaZona})" style="display:inline-block;background:${bg};color:${clr};font-weight:700;padding:3px 8px;border-radius:6px;font-size:11px;white-space:nowrap">${dot} ${excepLabel}</span>`;
            }
            const zonaShort=zonaCli==='Región Metropolitana'?'RM':zonaCli==='San Fernando'?'San Fdo':zonaCli;
            let sugHtml='<span style="color:var(--green);font-weight:600">OK</span>';
            if(c._adj>0){
                if(c._bombaNueva!=null){
                    const bgAdj=c._adj>=20?'#fcebeb':c._adj>=10?'#faeeda':'#e8f0fc';
                    const clAdj=c._adj>=20?'#a32d2d':c._adj>=10?'#854f0b':'#1a5fb4';
                    sugHtml=`<span style="display:inline-block;background:${bgAdj};color:${clAdj};font-weight:700;padding:3px 10px;border-radius:6px;font-size:11px">B${c._bombaNueva>=0?'+':''}${c._bombaNueva}</span>`;
                } else {
                    sugHtml=`<span style="color:var(--red);font-weight:700">+${c._adj}</span>`;
                }
            }
            h+=`<tr><td class="hi">${c.name}</td><td style="font-size:11px;color:var(--text2)">${zonaShort}</td><td style="font-size:11px;color:var(--text2)">${c.vendedor||'—'}</td><td>${scoreBadge(c.risk_score,lv)}</td><td style="font-size:11px;white-space:nowrap">${actLabel}</td><td style="text-align:center">${excepHtml}</td><td class="r">${c.plazo_pago_dias}d</td><td class="r ${diffCls}">${c.avg_payment_days}d</td><td class="r ${diffCls}">${c._diff>0?'+':''}${c._diff}d</td>`;
            h+=`<td class="r" style="color:${c._adjMora?'var(--red)':'var(--text3)'}">${c._adjMora||'—'}</td>`;
            h+=`<td class="r" style="color:${c._adjMargen?'var(--amber)':'var(--text3)'}">${c._adjMargen||'—'}</td>`;
            h+=`<td class="r" style="color:${c._adjFlag?'var(--red)':'var(--text3)'}">${c._adjFlag||'—'}</td>`;
            h+=`<td class="r">${fL(c.avg_monthly_litros)}</td><td style="text-align:center">${sugHtml}</td></tr>`;
        });
        h+='</tbody></table></div>';
    });
    el.innerHTML=h;
    // ── Chart 1: Donut with percentages ──
    dc('cRD');
    charts.cRD=new Chart(document.getElementById('cRiskDist'),{type:'doughnut',
        data:{labels:[`Crítico ${pctCrit}%`,`Alto ${pctAlto}%`,`Medio ${((sm.medios||0)/total*100).toFixed(1)}%`,`Bajo ${((sm.bajos||0)/total*100).toFixed(1)}%`],
            datasets:[{data:[sm.criticos||0,sm.altos||0,sm.medios||0,sm.bajos||0],backgroundColor:[C.red,C.amber,C.blue,C.green],borderWidth:2,borderColor:'#fff'}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'DM Sans',size:11}}},
            tooltip:{callbacks:{label:ctx=>{const v=ctx.parsed;const t=ctx.dataset.data.reduce((a,b)=>a+b,0);return ctx.label+': '+v+' ('+(v/t*100).toFixed(1)+'%)'}}}}
        }});
    // ── Chart 2: Riesgo Vigente AVLA (trend line) ──
    loadRiesgoHist().then(hist=>{
        if(!hist||hist.length===0)return;
        const last16=hist.slice(-16);
        const labels=last16.map(w=>{const d=new Date(w.fecha);return(d.getDate())+'/'+(d.getMonth()+1)});
        const riesgoPct=last16.map(w=>{const t=(w.no_cubierto||0)+(w.cubierto||0);return t>0?parseFloat(((w.no_cubierto||0)/t*100).toFixed(1)):0});
        const avg=riesgoPct.reduce((a,b)=>a+b,0)/riesgoPct.length;
        dc('cRV');
        charts.cRV=new Chart(document.getElementById('cRiesgoVigente'),{type:'line',
            data:{labels,datasets:[
                {label:'Riesgo Vigente %',data:riesgoPct,borderColor:C.red,backgroundColor:C.red+'22',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:riesgoPct.map(v=>v>12?C.red:v>8?C.amber:C.green),borderWidth:2},
                {label:'Promedio',data:riesgoPct.map(()=>parseFloat(avg.toFixed(1))),borderColor:C.amber,borderDash:[5,3],borderWidth:1,pointRadius:0,fill:false}
            ]},
            options:{responsive:true,maintainAspectRatio:false,
                plugins:{legend:{position:'bottom',labels:{font:{family:'DM Sans',size:10}}},
                    tooltip:{callbacks:{afterLabel:ctx=>{if(ctx.datasetIndex>0)return'';const w=last16[ctx.dataIndex];return'No cubierto: $'+(w.no_cubierto/1e6).toFixed(1)+'M\nCubierto: $'+(w.cubierto/1e6).toFixed(1)+'M'}}}},
                scales:{x:{ticks:{color:'#9c9b96',font:{size:9}},grid:{display:false}},
                    y:{beginAtZero:true,max:20,ticks:{callback:v=>v+'%',color:'#9c9b96',font:{size:9}},grid:{color:'rgba(0,0,0,.04)'}}}
            }});
    });
}
// ── OPERACIONES ──
function renderOperaciones(){
    const el=document.getElementById('p-operaciones');
    const op=D.operaciones||{};
    const months=op.months||[];
    if(months.length===0){
        el.innerHTML='<div class="chart-card" style="text-align:center;padding:3rem;color:var(--text3)">Sin datos de operaciones</div>';
        return;
    }
    // Current month (last in list)
    const curr=months[months.length-1]||{};
    const budget=curr.budget||0, actual=curr.actual||0;
    const cmpPct=curr.compliance_pct||0;
    // YTD sum
    const ytdActual=months.reduce((s,m)=>s+m.actual,0);
    const ytdBudget=months.reduce((s,m)=>s+m.budget,0);
    let h='<div class="kpi-grid">';
    h+=kpi('Gasto Mes Actual','$'+fNum(actual),null,cmpPct<=100?'c-green':cmpPct<=110?'c-amber':'c-red',cmpPct.toFixed(1)+'% presupuesto: $'+fNum(budget));
    h+=kpi('Gasto Acumulado Año','$'+fNum(ytdActual),null,'c-blue','Presupuesto: $'+fNum(ytdBudget));
    h+=kpi('Cumplimiento %',cmpPct.toFixed(1)+'%',null,cmpPct<=100?'c-green':cmpPct<=110?'c-amber':'c-red',cmpPct<=100?'OK':cmpPct<=110?'Alerta':'Exceso');
    h+='</div>';
    // Monthly breakdown table
    h+='<div class="section-label">Comparativo Mensual</div>';
    h+='<div class="table-card" style="overflow-x:auto"><table><thead><tr>';
    h+='<th>Mes</th><th class="r">Presupuesto</th><th class="r">Real</th><th class="r">Cumplimiento %</th>';
    h+='</tr></thead><tbody>';
    months.forEach((m,i)=>{
        const mp=m.compliance_pct||0;
        const sel=i===months.length-1;
        h+=`<tr style="${sel?'background:var(--accent-light)':''}">`;
        h+=`<td class="${sel?'hi':''}">${m.label}</td>`;
        h+=`<td class="r">$${fNum(m.budget)}</td>`;
        h+=`<td class="r">${fM(m.actual)}</td>`;
        h+=`<td class="r ${mp<=100?'ok':mp<=110?'':'bad'}">${mp.toFixed(1)}%</td>`;
        h+='</tr>';
    });
    h+='</tbody></table></div>';
    // Chart: Budget vs Actual last 6 months
    h+='<div class="chart-card"><div class="chart-title">Gasto vs Presupuesto <span class="badge">últimos 6 meses</span></div><div class="chart-wrap"><canvas id="cOpsMonthly"></canvas></div></div>';
    // Categories for current month
    const cats=curr.categories||{};
    const catEntries=Object.entries(cats).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    if(catEntries.length>0){
        h+='<div class="section-label">Categorías de Gasto — '+curr.label+'</div>';
        h+='<div class="table-card"><table><thead><tr><th>Categoría</th><th class="r">Monto</th></tr></thead><tbody>';
        catEntries.forEach(([cat,amt])=>{
            h+=`<tr><td>${cat}</td><td class="r">$${fNum(amt)}</td></tr>`;
        });
        h+='</tbody></table></div>';
    }
    el.innerHTML=h;
    // Render chart
    const gC3='rgba(0,0,0,.04)',tC3='#9c9b96';
    const labels=months.map(m=>m.label.split(' ')[0]);
    dc('cOM');
    charts.cOM=new Chart(document.getElementById('cOpsMonthly'),{type:'bar',
        data:{labels,datasets:[
            {label:'Presupuesto',data:months.map(m=>m.budget),backgroundColor:C.amber+'44',borderRadius:5},
            {label:'Real',data:months.map(m=>m.actual),backgroundColor:months.map(m=>m.compliance_pct<=100?C.green+'77':m.compliance_pct<=110?C.amber+'77':C.red+'77'),borderRadius:5}
        ]},options:co(tC3,gC3,v=>fM(v))});
}
// ── CASH FLOW (proyección capital de trabajo) ──
function getCFParams(){
    const buf=parseFloat(localStorage.getItem('cf_buffer')||'10');
    const pES=parseFloat(localStorage.getItem('cf_precio_enap')||'0');
    return {buffer:isNaN(buf)?10:buf, precioEnap:isNaN(pES)?0:pES};
}
function setCFParam(k,v){
    const n=parseFloat(v);
    if(!isNaN(n)) localStorage.setItem('cf_'+k,n);
    renderCashflow();
}
function resetCFPrecio(){
    localStorage.removeItem('cf_precio_enap');
    renderCashflow();
}
function renderCashflow(){
    const el=document.getElementById('p-cashflow');
    const W=D.weeks||[];
    if(W.length<5){el.innerHTML='<div class="note" style="text-align:center;padding:40px;color:var(--text3)">No hay suficientes semanas para proyectar (se requieren ≥5).</div>';return}

    // weeks[0] = current (parcial), weeks[1..4] = last 4 closed weeks for trend
    const cur=W[0], prev4=W.slice(1,5);

    // Trend averages from last 4 closed weeks
    const avgL=prev4.reduce((s,w)=>s+(w.litros||0),0)/4;
    const avgV=prev4.reduce((s,w)=>s+(w.ventas||0),0)/4;
    const avgR=prev4.reduce((s,w)=>s+(w.recaud||0),0)/4;
    const avgC=prev4.reduce((s,w)=>s+(w.compras_odoo||0),0)/4;

    // Implicit ENAP price per liter from last 4 weeks (compras_odoo / litros)
    const totalL4=prev4.reduce((s,w)=>s+(w.litros||0),0);
    const totalC4=prev4.reduce((s,w)=>s+(w.compras_odoo||0),0);
    const precioImpl=totalL4>0?totalC4/totalL4:0;

    // User-overridable ENAP price (default = implicit)
    const P=getCFParams();
    const precioCompra=P.precioEnap>0?P.precioEnap:precioImpl;

    // Projection: 4-week trend (no YoY yet — only 16 weeks of history)
    const projL=avgL, projV=avgV, projR=avgR;
    const projC=avgL*precioCompra;  // compras = litros × precio compra ENAP

    // Gap = compras a pagar − recaudación esperada
    const gap=projC-projR;
    const bufFactor=1+(P.buffer/100);
    const saldoReq=Math.max(0,gap)*bufFactor;

    // Current cash on hand
    const cajaActual=D.total_cash||0;
    const cobertura=saldoReq>0?(cajaActual/saldoReq):0;

    // Status helper
    const cls=(req)=>{
        if(req<=0)return'c-green';
        const c=cajaActual/req;
        return c>=1.2?'c-green':c>=0.9?'c-amber':'c-red';
    };

    // Helper: format M without leading $ (since we add $ ourselves)
    const fNoSign=n=>!n&&n!==0?'—':(n/1e6).toFixed(1)+'M';

    let h='<div class="section-label">💰 Cash Flow — Proyección Capital de Trabajo</div>';
    h+='<div class="note" style="margin-bottom:16px">Tendencia 4 semanas cerradas. Los lunes este tablero te dice cuánta caja necesitas para cubrir compras a proveedores antes de que entren los cobros de la semana. Modelo: proyección = promedio últimas 4 semanas. Próxima fase: ajuste estacional YoY.</div>';

    // ── Parameters bar ──
    h+='<div class="cf-params">';
    h+='<div class="cf-param"><label>Precio compra ENAP $/L</label>';
    h+=`<input type="number" value="${Math.round(precioCompra)}" onchange="setCFParam('precio_enap',this.value)" step="10" min="0"/>`;
    h+=`<span class="cf-hint">Implícito ${Math.round(precioImpl)} $/L · `;
    h+=`<a href="javascript:void(0)" onclick="resetCFPrecio()" style="color:var(--blue);text-decoration:underline">usar implícito</a></span></div>`;
    h+='<div class="cf-param"><label>Colchón seguridad %</label>';
    h+=`<input type="number" value="${P.buffer}" onchange="setCFParam('buffer',this.value)" step="1" min="0" max="50"/>`;
    h+='<span class="cf-hint">Sobre el gap proyectado</span></div>';
    h+='</div>';

    // ── KPIs Esta Semana ──
    h+='<div class="section-label" style="margin-top:18px">Esta Semana ('+(cur.label||'')+')</div>';
    h+='<div class="kpis">';
    h+=kpi('Venta Proyectada','$'+fNoSign(projV),null,'c-blue',Math.round(projL).toLocaleString()+' L');
    h+=kpi('Recaudación Esperada','$'+fNoSign(projR),null,'c-green','Promedio 4 sem');
    h+=kpi('Compras ENAP Proy.','$'+fNoSign(projC),null,'c-amber',Math.round(projL).toLocaleString()+' L × $'+Math.round(precioCompra));
    h+=kpi('Gap (Compras − Recaud)',(gap>=0?'+$':'-$')+fNoSign(Math.abs(gap)),null,gap>0?'c-red':'c-green',gap>0?'Necesitas caja':'Cubierto por recaudación');
    h+=kpi('Saldo Requerido Lunes','$'+fNoSign(saldoReq),null,cls(saldoReq),'Gap × +'+P.buffer+'% colchón');
    h+=kpi('Caja Actual','$'+fNoSign(cajaActual),null,saldoReq<=0?'c-green':(cobertura>=1.2?'c-green':cobertura>=0.9?'c-amber':'c-red'),saldoReq>0?(cobertura*100).toFixed(0)+'% del requerido':'Sin gap que cubrir');
    h+='</div>';

    // ── Próxima semana (mismo modelo) ──
    h+='<div class="section-label" style="margin-top:18px">Próxima Semana (proyección)</div>';
    h+='<div class="note" style="margin-bottom:12px">Sin estacionalidad por ahora — usa el mismo promedio 4-sem. La próxima fase incorporará comparativo año anterior.</div>';
    h+='<div class="kpis">';
    h+=kpi('Venta Proyectada','$'+fNoSign(projV),null,'c-blue',Math.round(projL).toLocaleString()+' L');
    h+=kpi('Recaudación Esperada','$'+fNoSign(projR),null,'c-green','Promedio 4 sem');
    h+=kpi('Compras ENAP Proy.','$'+fNoSign(projC),null,'c-amber',Math.round(projL).toLocaleString()+' L × $'+Math.round(precioCompra));
    h+=kpi('Gap',(gap>=0?'+$':'-$')+fNoSign(Math.abs(gap)),null,gap>0?'c-red':'c-green',null);
    h+=kpi('Saldo Requerido Lunes','$'+fNoSign(saldoReq),null,cls(saldoReq),'Mismo modelo 4-sem');
    h+='</div>';

    // ── Tabla histórica + proyección ──
    h+='<div class="section-label" style="margin-top:18px">Histórico 4 Semanas + Proyección</div>';
    h+='<div class="table-card" style="overflow-x:auto"><table><thead><tr>';
    h+='<th>Semana</th><th class="r">Litros</th><th class="r">Venta</th><th class="r">Recaudación</th><th class="r">Compras Odoo</th><th class="r">Gap (C−R)</th><th class="r">Cobertura</th>';
    h+='</tr></thead><tbody>';
    [...prev4].reverse().forEach(w=>{
        const g=(w.compras_odoo||0)-(w.recaud||0);
        const cov=(w.compras_odoo||0)>0?(w.recaud||0)/(w.compras_odoo||0):0;
        h+='<tr>';
        h+='<td>'+w.label+'</td>';
        h+='<td class="r">'+(w.litros||0).toLocaleString()+'</td>';
        h+='<td class="r">$'+fNoSign(w.ventas||0)+'</td>';
        h+='<td class="r">$'+fNoSign(w.recaud||0)+'</td>';
        h+='<td class="r">$'+fNoSign(w.compras_odoo||0)+'</td>';
        h+='<td class="r" style="color:'+(g>0?'var(--red)':'var(--green)')+'">'+(g>=0?'+$':'-$')+fNoSign(Math.abs(g))+'</td>';
        h+='<td class="r">'+(cov*100).toFixed(0)+'%</td>';
        h+='</tr>';
    });
    // Esta semana proyectada
    h+='<tr class="cf-row-proj">';
    h+='<td>📍 '+cur.label+' (proy)</td>';
    h+='<td class="r">'+Math.round(projL).toLocaleString()+'</td>';
    h+='<td class="r">$'+fNoSign(projV)+'</td>';
    h+='<td class="r">$'+fNoSign(projR)+'</td>';
    h+='<td class="r">$'+fNoSign(projC)+'</td>';
    h+='<td class="r" style="color:'+(gap>0?'var(--red)':'var(--green)')+'">'+(gap>=0?'+$':'-$')+fNoSign(Math.abs(gap))+'</td>';
    h+='<td class="r">'+(projC>0?(projR/projC*100).toFixed(0):'—')+'%</td>';
    h+='</tr>';
    // Próxima semana proyectada
    h+='<tr class="cf-row-next">';
    h+='<td>🔮 Próx. semana (proy)</td>';
    h+='<td class="r">'+Math.round(projL).toLocaleString()+'</td>';
    h+='<td class="r">$'+fNoSign(projV)+'</td>';
    h+='<td class="r">$'+fNoSign(projR)+'</td>';
    h+='<td class="r">$'+fNoSign(projC)+'</td>';
    h+='<td class="r" style="color:'+(gap>0?'var(--red)':'var(--green)')+'">'+(gap>=0?'+$':'-$')+fNoSign(Math.abs(gap))+'</td>';
    h+='<td class="r">'+(projC>0?(projR/projC*100).toFixed(0):'—')+'%</td>';
    h+='</tr>';
    h+='</tbody></table>';
    h+='<div class="note">Proyección = promedio últimas 4 semanas cerradas. Gap > 0 = compras superan recaudación → necesitas caja para cubrir el desfase. Cobertura = % de compras cubierto por recaudación de la semana.</div></div>';

    // ── Diagnóstico ──
    h+='<div class="section-label" style="margin-top:18px">Diagnóstico Lunes</div>';
    h+='<div class="cf-diag">';
    if(saldoReq<=0){
        h+='<div class="cf-ok"><strong>✅ Cubierto sin gap</strong> — La recaudación esperada ($'+fNoSign(projR)+') supera las compras proyectadas ($'+fNoSign(projC)+'). No requiere caja adicional para la semana.</div>';
    } else if(cobertura>=1.2){
        h+='<div class="cf-ok"><strong>✅ Holgado</strong> — Caja actual ($'+fNoSign(cajaActual)+') cubre '+(cobertura*100).toFixed(0)+'% del saldo requerido ($'+fNoSign(saldoReq)+'). Margen amplio para la semana.</div>';
    } else if(cobertura>=0.9){
        h+='<div class="cf-warn"><strong>⚠️ Ajustado</strong> — Caja actual ($'+fNoSign(cajaActual)+') cubre '+(cobertura*100).toFixed(0)+'% del requerido ($'+fNoSign(saldoReq)+'). Monitorear cobranza durante la semana, especialmente martes y miércoles.</div>';
    } else {
        const falta=saldoReq-cajaActual;
        h+='<div class="cf-bad"><strong>🚨 Riesgo</strong> — Faltan <strong>$'+fNoSign(falta)+'</strong> para cubrir la semana. Caja actual: $'+fNoSign(cajaActual)+' · Requerido: $'+fNoSign(saldoReq)+'. Acciones: acelerar cobranza Itaú, revisar descuento de cheques en cartera, o postergar compras a ENAP.</div>';
    }
    h+='</div>';

    el.innerHTML=h;
}
// ── HELPERS ──
function kpi(label,val,delta,cls,sub){
    return `<div class="kpi ${cls}"><div class="kpi-label">${label}</div><div class="kpi-val">${val}</div>${dH(delta)}${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`;
}
function co(tC,gC,fmt){
    return{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{titleFont:{family:'DM Sans'},bodyFont:{family:'DM Sans'},backgroundColor:'#1a1a18',cornerRadius:8,padding:10}},
        scales:{x:{ticks:{color:tC,font:{size:9,family:'DM Sans'},maxRotation:50},grid:{display:false}},
                y:{ticks:{color:tC,font:{size:9,family:'DM Sans'},callback:v=>fmt(v)},grid:{color:gC}}}
    };
}
function dc(k){if(charts[k]){charts[k].destroy();delete charts[k]}}
// ── LOAD ──
async function loadData(){
    try{
        const [r, r2]=await Promise.all([
            fetch('ceo-data.json?t='+Date.now()),
            fetch('crm-data.json?t='+Date.now()).catch(()=>null)
        ]);
        if(!r.ok) throw new Error('HTTP '+r.status);
        D=await r.json();
        if(r2&&r2.ok){D._crm=await r2.json()}
        const u=new Date(D.updated);
        document.getElementById('timestamp').textContent=u.toLocaleDateString('es-CL')+' '+u.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
        document.getElementById('ftr').textContent=`Odoo PRODUCCION · margin_zone · NC descontadas · ${u.toLocaleDateString('es-CL')}`;
        document.getElementById('loading').style.display='none';
        document.getElementById('main').style.display='block';
        setupTabs();
        render();
    }catch(e){
        document.getElementById('loading').innerHTML=`<div style="color:var(--red);text-align:center"><h3 style="font-size:16px;margin-bottom:8px">Error al cargar datos</h3><p style="font-size:12px;color:var(--text3)">${e.message}</p></div>`;
    }
}
loadData();
    </script>
